<!-- ===== v21: Random Event "ผจญภัยโลกกว้าง" · วางเป็น <script> ก้อนใหม่ท้ายสุด (ไม่ต้องใช้ SQL / ไม่แก้โค้ดเดิม) =====
     เปิดเกม → สุ่ม 10% ว่าสัตว์หนีออกจากบ้าน (หายจากจอ) → 20 วินาทีต่อมาเดินกลับเข้าจอ → สุ่มผล: 🤒 ป่วย / ✨ ได้ EXP 10 หน่วย / 🐱 พาลูกแมวกลับมา (ความสุข +30 อยู่ 5 นาที)
     ปรับค่าได้ที่ ADV ด้านล่าง · ทดสอบ: เปิดแถบ DEV (?dev=1 หรือ Ctrl+Shift+D) แล้วกด "🎒 ทดสอบผจญภัย" หรือเรียก startAdventure() ใน console -->
<script>
(function(){
const ADV={
  LEAVE:1800,RET:1800,          // ms · เวลาเดินออก / เดินกลับ
  AWAY_MS:20000,                // ms · หนีออกจากบ้านนาน 20 วินาที
  SICK_P:.4,KIT_P:.2,           // ผลตอนกลับมา: ป่วย 40% · เจอลูกแมว 20% · ที่เหลือ 40% = ได้ EXP
  KIT_HAP:30,KIT_MS:300000,     // ลูกแมว: ความสุข +30 · อยู่ในจอ 5 นาที แล้วเดินออก
  EXP:10,                       // EXP ที่ได้เมื่อไม่ป่วย
  HP_SICK:30,                   // สุขภาพลดเหลือเท่านี้เมื่อป่วย
  OPEN_P:.1                     // โอกาสเกิดเหตุการณ์ทุกครั้งที่ผู้เล่นเปิดเกม (10%)
};
const ON=()=>!!(sb&&user), alive=()=>!!P&&!P.dead, ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* สถานะผจญภัยคำนวณจากเวลาล้วน ๆ (เก็บใน P.adv → เซฟ/รีโหลด/ปิดเกมแล้วเปิดใหม่ก็ยังต่อเนื่อง) */
function st(now){const a=P&&P.adv;if(!a)return null;now=now||Date.now();
  if(now<a.t0+ADV.LEAVE)return{ph:'leave',k:(now-a.t0)/ADV.LEAVE};
  if(now<a.end)return{ph:'away',left:a.end-now};
  if(now<a.end+ADV.RET)return{ph:'ret',k:(now-a.end)/ADV.RET};
  return{ph:'done'}}
const busy=()=>{const s=st();return !!s&&s.ph!=='done'};
window.advBusy=busy;

/* ---------- เริ่มผจญภัย ---------- */
window.startAdventure=function(ms,force,instant,srv){
  if(!alive()||P.adv)return false;const now=Date.now();
  const dur=ms>0?ms:ADV.AWAY_MS;
  rt.panel=null;rt.tp=null;rt.walkUntil=0;rt.eatUntil=0;rt.playUntil=0;
  P.adv={t0:instant?now-ADV.LEAVE:now,end:(instant?now:now+ADV.LEAVE)+dur,d:rt.x<56?-1:1,x0:rt.x,force:force||null,srv:srv?1:0};
  toast('🏃 '+P.name+' หนีออกจากบ้าน!');try{renderPanel();update()}catch(e){}save(true);return true};

/* ---------- กลับมา → สุ่มผล ---------- */
const css=document.createElement('style');css.textContent='#advCard .ai{font-size:56px;line-height:1.1;margin:4px 0 8px}#advCard b{display:block;font-size:18px}#advCard .as{font-size:13.5px;color:var(--mut);margin:6px 0 12px;line-height:1.5}#advCard .ax{display:inline-block;margin:2px 0 12px;padding:4px 16px;border-radius:999px;font-weight:800;font-size:15px}#advCard .ax.ok{background:rgba(245,197,66,.22);color:#946400}#advCard .ax.bad{background:rgba(120,190,90,.22);color:#4f7a2a}';
document.head.appendChild(css);
const ov=document.createElement('div');ov.id='advModal';ov.className='modal hide';
ov.innerHTML='<div class="mbox" id="advCard" style="max-width:320px;text-align:center"></div>';document.body.appendChild(ov);
const card=ov.firstChild,close=()=>ov.classList.add('hide');
function show(ic,title,sub,tag,cls){
  card.innerHTML='<div class="ai">'+ic+'</div><b>'+esc(title)+'</b><div class="as">'+esc(sub)+'</div><div class="ax '+cls+'">'+esc(tag)+'</div><button id="advOk" style="width:100%">ตกลง</button>';
  card.querySelector('#advOk').onclick=close;ov.classList.remove('hide')}
function resolve(res){   // res = 'sick' | 'exp' จาก server · ไม่ส่งมา = สุ่มในเครื่อง (ผู้เล่นไม่ล็อกอิน/ยังไม่ได้รัน SQL)
  const a=P.adv;P.adv=null;rt.x=a.x0;rt.walkUntil=0;
  const kind=res||a.force||(()=>{const x=Math.random();return x<ADV.SICK_P?'sick':x<ADV.SICK_P+ADV.KIT_P?'kitten':'exp'})();
  if(kind==='sick'){
    P.sick=true;P.hp=Math.min(P.hp,ADV.HP_SICK);
    show('🤒',P.name+' กลับมาแล้ว… แต่ไม่สบาย','ไปตากลมตากฝนมาเต็มที่ ตัวร้อนเลย ต้องกินยารักษาด้วยนะ','ป่วย · สุขภาพเหลือ '+ADV.HP_SICK,'bad');
    toast('🤒 '+P.name+' กลับจากผจญภัยพร้อมอาการป่วย')}
  else if(kind==='kitten'){
    P.hap=clamp(P.hap+ADV.KIT_HAP);P.kit={t0:Date.now(),base:a.x0<56?140:32,side:a.x0<56?1:-1,ph:Math.random()*6};
    show('<img src="'+KIT_IMG+'" alt="" style="width:88px;image-rendering:pixelated">',P.name+' พาลูกแมวน้อยกลับมาด้วย!','ระหว่างผจญภัย ไปเจอลูกแมวน้อยน่ารัก มันจะอยู่เป็นเพื่อนที่บ้าน 5 นาที','🐱 ความสุข +'+ADV.KIT_HAP+' หน่วย','ok');
    toast('🐱 '+P.name+' พาลูกแมวน้อยกลับมา! ความสุข +'+ADV.KIT_HAP)}
  else{
    const gain=Math.round(ADV.EXP*(window.SOULM?SOULM.xp:1));addXp(ADV.EXP);
    show('🗺️',P.name+' กลับจากการผจญภัยแล้ว!','ได้เห็นโลกกว้างและเจอเรื่องราวมากมาย กลับมาพร้อมประสบการณ์ล้ำค่า','✨ EXP +'+gain+' หน่วย','ok');
    toast('🗺️ '+P.name+' กลับมาแล้ว! EXP +'+gain)}
  try{renderPanel();update()}catch(e){}save(true)}

/* ---------- ลูกแมวน้อย: เดินเข้าจอ → อยู่ 5 นาที → เดินออกนอกจอ (เก็บใน P.kit เวลาล้วน ๆ → รีโหลดแล้วยังต่อเนื่อง) ---------- */
const KIT_IMG='assets/img/kit_img.png',KIT=new Image();KIT.src=KIT_IMG;
const KIT_IN=1800,KIT_OUT=2200;
const KIT_SCALE=.4;   // ขนาดลูกแมวในจอ = ครึ่งหนึ่งของสัตว์วัย baby (ปรับได้)
const KATLAS=new Image();KATLAS.src='assets/img/katlas.png';
const KCW=57,KCH=42;   // อะนิเมชันลูกแมว: ช่อง 0 นั่ง(เก่า) · 1 ง่วง · 2–3 นอนหลับ · 5–9 เดิน · 10–13 idle (ภาพต้นฉบับหันขวา · ขนาดตัว = KIT_SCALE × ขนาดที่ตั้งไว้เดิม)
const KIDLE=[10,10,10,11,11,10,10,12,12,13,13,13];   // ลำดับเฟรม idle (เฟรมละ 0.4 วิ · วน 4.8 วิ): นิ่ง → เอียงหัว → นิ่ง → ชำเลืองตา/กะพริบ → นิ่ง
const sgn=v=>v<0?-1:1;
/* วงจรตอนอยู่ในจอ (วนทุก 60 วิ): นั่ง 10 → เดินไป B 6 → นั่ง 8 → เดินกลับ A 6 → ง่วง 4 → นอน 24 → ง่วง 2 */
function kitCycle(c,A,B){
  if(c<10)return{x:A,m:'idle',d:1};
  if(c<16){const t=ease((c-10)/6);return{x:A+(B-A)*t,m:'walk',d:sgn(B-A)}}
  if(c<24)return{x:B,m:'idle',d:sgn(B-A)};
  if(c<30){const t=ease((c-24)/6);return{x:B+(A-B)*t,m:'walk',d:sgn(A-B)}}
  if(c<34)return{x:A,m:'drowsy',d:sgn(A-B)};
  if(c<58)return{x:A,m:'sleep',d:sgn(A-B)};
  return{x:A,m:'drowsy',d:sgn(A-B)}}
function kitPos(now){const k=P&&P.kit;if(!k)return null;const e=now-k.t0,stayEnd=ADV.KIT_MS,outEnd=stayEnd+KIT_OUT;
  if(e>=outEnd)return{gone:true};
  const edge=k.side>0?236:-44,A=k.base,B=Math.max(26,Math.min(166,A-k.side*52));
  if(e<KIT_IN){const t=ease(e/KIT_IN);return{x:edge+(A-edge)*t,m:'walk',d:sgn(A-edge)}}
  if(e<stayEnd)return kitCycle(((e-KIT_IN)/1000)%60,A,B);
  const s0=kitCycle(((stayEnd-KIT_IN)/1000)%60,A,B),t=ease((e-stayEnd)/KIT_OUT);   // เดินออกจากตำแหน่งที่อยู่ ณ ตอนครบ 5 นาที
  return{x:s0.x+(edge-s0.x)*t,m:'walk',d:sgn(edge-s0.x)}}
function drawKit(c,now){const p=kitPos(now);if(!p||p.gone||!KATLAS.complete||!KATLAS.width)return;
  const fi=p.m==='walk'?5+Math.floor(now/120)%5:p.m==='idle'?KIDLE[Math.floor(now/400)%KIDLE.length]:p.m==='drowsy'?1:2+Math.floor(now/1600)%2;
  const w=KCW*KIT_SCALE*1.25,h=KCH*KIT_SCALE*1.25;   // atlas ทำไว้ 2 เท่า ของขนาดที่แสดง (KIT_SCALE .4 → ตรงกับขนาดเดิม)
  c.save();c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  c.translate(Math.round(p.x),0);if(p.d<0)c.scale(-1,1);
  c.drawImage(KATLAS,fi*KCW,0,KCW,KCH,-Math.round(w/2),Math.round(106-h),Math.round(w),Math.round(h));c.restore()}
setInterval(()=>{if(P&&P.kit&&(kitPos(Date.now())||{}).gone){P.kit=null;save(true)}},1000);

/* ---------- เชื่อมกับระบบเดิม (ห่อฟังก์ชันเดิมโดยไม่แก้ต้นฉบับ) ---------- */
// 1) ท่าเดิน ตอนเดินออก/เดินกลับ
const _ca=chooseAnim;chooseAnim=function(p,now){const s=st(now);
  if(s&&(s.ph==='leave'||s.ph==='ret')){rt.tp=null;return 'walk'}return _ca.apply(this,arguments)};
// 2) วาดตัวสัตว์: เลื่อนออกนอกจอ / ซ่อนตอนไม่อยู่ / เลื่อนกลับเข้ามา
const _draw=player.draw;player.draw=function(c,sh,x,y,s,f){const t=st();
  if(t&&t.ph!=='done'){if(t.ph==='away')return;const d=P.adv.d,k=ease(t.k);
    if(t.ph==='leave'){x=P.adv.x0+d*170*k;f=d<0}else{x=P.adv.x0+d*170*(1-k);f=d>0}}
  return _draw.call(this,c,sh,x,y,s,f)};
// 3) ระหว่างออกไป ค่าสถานะไม่ลด (กันตายตอนไม่อยู่)
const _step=step;step=function(p){if(p&&p===P&&busy())return;return _step.apply(this,arguments)};
// 4) ระหว่างออกไป ดูแล/สู้ไม่ได้
const _act=act;act=function(a){
  if(alive()&&busy()&&['feed','play','bath','sleep','heal','battle'].includes(a))return toast('🎒 '+P.name+' ออกไปหนีออกจากบ้านอยู่ รอให้กลับมาก่อนนะ');
  return _act.apply(this,arguments)};
const _br=btReady;btReady=function(){if(alive()&&busy())return'หนีออกจากบ้านอยู่…';return _br.apply(this,arguments)};
// 4.5) วาดลูกแมวต่อจากตัวสัตว์ในทุกเฟรม
const _dsf=drawSocFx;drawSocFx=function(c,now){_dsf.apply(this,arguments);try{drawKit(c,now)}catch(e){}};
// 5) ข้อความใต้สัตว์
const _up=update;update=function(){_up.apply(this,arguments);const t=st();if(!alive()||!t||t.ph==='done')return;
  const e=$('#say');if(e)e.textContent=t.ph==='away'?'🏃 หนีออกจากบ้าน… อีก '+Math.ceil(t.left/1000)+' วิ':t.ph==='leave'?'🏃 หนีออกจากบ้าน!':'🏠 กลับมาแล้ว!'};

/* ---------- ตัวจับเวลา: ปิดงานผจญภัย + สุ่มเริ่มเหตุการณ์ใหม่ ---------- */
let fin=false;
setInterval(async()=>{if(fin||!alive()||!P.adv)return;const s=st();if(!s||s.ph!=='done')return;
  if(!(P.adv.srv&&ON())){resolve();return}
  fin=true;const r=await socCall('adventure_finish');fin=false;if(!alive()||!P.adv)return;   // ผล + เวลาตัดสินที่ server
  if(r&&r.ok&&r.outcome)resolve(r.outcome);
  else if(r&&r.code==='wait')P.adv.end=Date.now()+(r.wait_ms||1000);                       // server ว่ายังไม่ครบเวลา → รอต่อ
  else if(r&&r.code==='none'){const a=P.adv;P.adv=null;rt.x=a.x0;try{update()}catch(e){}save(true)}  // อีกอุปกรณ์รับผลไปแล้ว → ไม่ให้ซ้ำ
  else resolve()},500);                                                                     // server ไม่ตอบ/ยังไม่ได้รัน SQL → สุ่มในเครื่อง

/* สุ่มทุกครั้งที่ผู้เล่นเปิดเกม (เริ่มเกมครั้งแรกของหน้านี้): ถ้าโดน สัตว์หายจากจอทันทีพร้อมแถบสถานะ 'หนีออกจากบ้าน' */
let rolled=false;const _sg=startGame;startGame=function(){const r=_sg.apply(this,arguments);
  if(!rolled&&alive()){rolled=true;openRoll()}return r};
async function openRoll(){
  if(ON()){const r=await socCall('adventure_roll');if(!alive())return;      // server สุ่ม 10% + จับเวลา 20 วิ (ต้องรัน supabase_v21_adventure.sql)
    if(r&&r.ok!==false){
      if(r.active){if(P.adv)P.adv.srv=1;else{rt.panel=null;rt.tp=null;rt.walkUntil=0;startAdventure(r.remaining_ms,null,true,true)}}
      return}}
  if(!P.adv&&Math.random()<ADV.OPEN_P){rt.panel=null;rt.tp=null;rt.walkUntil=0;startAdventure(0,null,true)}}   // สำรอง: ผู้เล่นไม่ล็อกอิน / ไม่มี SQL
window.advOpenRoll=openRoll;

/* 🛠️ DEV: ปุ่มทดสอบ (หายไป 6 วินาที) · เลือกผลลัพธ์ได้ */
function devUI(){const b=document.getElementById('devBar');if(!b||b.querySelector('#devAdv'))return;
  const s=document.createElement('select');s.id='devAdvR';s.style.cssText='font-size:12px;padding:3px 4px;border-radius:6px';
  s.innerHTML='<option value="">ผล: สุ่ม</option><option value="exp">ผล: ได้ EXP</option><option value="sick">ผล: ป่วย</option><option value="kitten">ผล: ลูกแมว</option>';
  const k=document.createElement('button');k.id='devAdv';k.style.cssText='font-size:12px;padding:3px 8px';k.textContent='🎒 ทดสอบผจญภัย';
  k.onclick=()=>{if(!startAdventure(6000,s.value||null))toast('🛠️ เริ่มไม่ได้ (ไม่มีสัตว์ที่มีชีวิต หรือกำลังหนีออกจากบ้านอยู่)')};b.appendChild(s);b.appendChild(k)}
const _db=devBar;devBar=function(on){_db(on);if(on)devUI()};devUI();
})();
</script>

<!-- ===== v22: มินิเกม "วิ่งกระโดด" · เข้าจากแอคชั่น ⚽ เล่น → วิ่งกระโดด · วางเป็น <script> ก้อนใหม่ท้ายสุด (ไม่ต้องใช้ SQL) ===== -->
<script>
(function(){
const W=360,H=160,GY=132,PX=60;                 // ขนาดฉาก · เส้นพื้น · ตำแหน่ง x ของสัตว์เลี้ยง
const CFG={ENERGY:10,HAP_MIN:6,HAP_MAX:20,HAP_PER:40,COIN_MIN:2,COIN_MAX:5,COIN_PER:200,   // เหรียญทอง 2–5 ต่อรอบ: 2 + ทุก 200 คะแนน +1 (600 คะแนนขึ้นไป = 5)
     // จบเกม: พลังงาน −10 · สุข +6 ถึง +20 (ทุก 40 คะแนน +1)
  G:1800,JUMP:500,V0:190,VMAX:400,SC:5,
  TH:61,HW:20,HH:34};   // TH = ความสูงตัวละครที่เห็น (px) = ขนาดมังกรวัยรุ่น เท่ากันทุกตัวทุกวัย · HW/HH = กล่องชน
const $q=s=>document.querySelector(s);
const css=document.createElement('style');css.textContent='#dnModal .mbox{max-width:640px!important}#dnModal .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#dnWrap{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line)}#dnCv{display:block;width:100%;aspect-ratio:'+W+'/'+H+';image-rendering:pixelated;touch-action:none;background:#dff3ff}#dnOv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(20,10,40,.55);color:#fff;text-align:center;padding:10px}#dnOv.hide{display:none}#dnOv .row{display:flex;gap:8px;justify-content:center}#dnHud{display:flex;justify-content:space-between;font-weight:700;margin:4px 2px 6px}#dnCtl{display:flex;gap:8px;margin-top:8px}#dnCtl button{flex:1;min-height:52px;font-size:16px;touch-action:none}';
document.head.appendChild(css);
const m=document.createElement('div');m.id='dnModal';m.className='modal hide';
m.innerHTML='<div class="mbox"><div class="top"><b>วิ่งกระโดด</b><button id="dnClose" aria-label="ปิด" style="flex:0 0 auto;min-height:0;padding:4px 12px">✕</button></div>'
 +'<div id="dnHud"><span id="dnSc">คะแนน 0</span><span id="dnBest">สูงสุด 0</span></div>'
 +'<div id="dnWrap"><canvas id="dnCv" width="'+W+'" height="'+H+'"></canvas><div id="dnOv" class="hide"></div></div>'
 +'<div id="dnCtl"><button id="dnJump" class="on">⬆ กระโดด</button><button id="dnDuck">⬇ ก้ม</button></div>'
 +'<div class="mut" style="margin-top:6px;font-size:12px">แตะ/Space/↑ = กระโดด · กดค้างครึ่งล่างของจอ/↓ = ก้ม (หลบนก) · จบเกม สุข +'+CFG.HAP_MIN+'–'+CFG.HAP_MAX+' · 🪙 +'+CFG.COIN_MIN+'–'+CFG.COIN_MAX+' · พลังงาน −'+CFG.ENERGY+'</div></div>';
document.body.appendChild(m);
const cv=$q('#dnCv'),c=cv.getContext('2d'),ov=$q('#dnOv');c.imageSmoothingEnabled=false;
let G=null,raf=0,lastT=0,isOpen=false,ap=null,jumpReq=false,duckHeld=false;

const needMsg=()=>!P?'ยังไม่พร้อม':P.dead?'จากไปแล้ว…':P.bathing?'🛁 กำลังอาบน้ำอยู่…':P.sleeping?'😴 กำลังหลับอยู่…':(window.advBusy&&window.advBusy())?'🏃 หนีออกจากบ้านอยู่ รอให้กลับมาก่อนนะ':P.en<15?'⚡ เหนื่อยเกินไป พักก่อนนะ':'';
function showOv(h){ov.innerHTML=h;ov.classList.remove('hide')}
const best=()=>(P&&P.dinoBest)||0;
function paintHud(){$q('#dnSc').textContent='คะแนน '+Math.floor(G?G.score:0);$q('#dnBest').textContent='สูงสุด '+best()}

function newGame(){G={state:'ready',score:0,dist:0,y:0,vy:0,duck:false,speed:CFG.V0,next:260,obs:[],clouds:[{x:60,y:30},{x:200,y:18},{x:320,y:40}],t:0,flash:0};jumpReq=false}
function readyOv(){showOv('<b style="font-size:20px">วิ่งกระโดด</b><div style="font-size:13px">พา <b>'+esc(P.name||'สัตว์เลี้ยง')+'</b> วิ่งข้ามกระบองเพชร · ก้มหลบนก!</div><div class="row"><button id="dnGo" class="on">▶ เริ่มเล่น</button></div>');$q('#dnGo').onclick=start}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function start(){if(!G||G.state==='run')return;newGame();G.state='run';ov.classList.add('hide')}

/* ---------- สร้างสิ่งกีดขวาง ---------- */
function spawn(){
  const bird=G.score>150&&Math.random()<.3;
  if(bird){G.obs.push({k:'bird',x:W+20,w:26,h:14,b:24});return}   // นกบินต่ำ: ก้มหลบ (หรือกระโดดข้าม)
  const n=1+(Math.random()<.35?1:0)+(G.score>250&&Math.random()<.25?1:0),h=22+Math.floor(Math.random()*14);
  G.obs.push({k:'cactus',x:W+20,w:11*n+(n-1)*2,h,b:0,n})}
function hit(o){const ph=G.duck&&G.y<2?Math.round(CFG.HH*.53):CFG.HH,px=PX-CFG.HW/2,pw=CFG.HW,py=GY-G.y-ph;
  const ox=o.x+2,ow=o.w-4,oy=GY-o.b-o.h+2,oh=o.h-4;return px<ox+ow&&px+pw>ox&&py<oy+oh&&py+ph>oy}

/* ---------- อัปเดต ---------- */
function update(dt){const g=G;g.t+=dt;if(g.state!=='run')return;
  g.speed=Math.min(CFG.VMAX,CFG.V0+g.dist/60);g.dist+=g.speed*dt;g.score=g.dist/12;
  g.duck=duckHeld;
  if(jumpReq&&g.y===0){g.vy=CFG.JUMP;jumpReq=false}else if(g.y===0)jumpReq=false;
  if(g.y>0||g.vy>0){g.vy-=CFG.G*dt*(g.duck?1.8:1);g.y=Math.max(0,g.y+g.vy*dt);if(g.y===0)g.vy=0}
  g.next-=g.speed*dt;if(g.next<=0){spawn();g.next=g.speed*.75+70+Math.random()*220}
  g.obs.forEach(o=>o.x-=g.speed*dt);g.obs=g.obs.filter(o=>o.x+o.w>-10);
  g.clouds.forEach(k=>{k.x-=g.speed*dt*.15;if(k.x<-40){k.x=W+20;k.y=10+Math.random()*40}});
  if(g.obs.some(hit))die();
}

/* ---------- วาด ---------- */
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)}
function drawCactus(o){const x=o.x,top=GY-o.h;
  for(let i=0;i<o.n;i++){const bx=x+i*13,bh=o.h-(i%2?6:0),t=GY-bh;
    rect(bx+3,t,5,bh,'#3f8f3a');rect(bx+3,t,5,2,'#6bbf5a');rect(bx,t+bh*.35,3,8,'#3f8f3a');rect(bx,t+bh*.35+6,6,3,'#3f8f3a');rect(bx+8,t+bh*.2,3,8,'#3f8f3a');rect(bx+5,t+bh*.2+6,6,3,'#3f8f3a');rect(bx+3,t,1,bh,'#2e6f2b')}}
function drawBird(o){const y=GY-o.b-o.h,f=Math.floor(G.t*8)%2;
  rect(o.x+6,y+5,14,6,'#6b5b95');rect(o.x,y+6,6,3,'#ffb347');rect(o.x+18,y+4,5,4,'#6b5b95');rect(o.x+21,y+5,2,1,'#fff');
  if(f){rect(o.x+8,y-1,8,6,'#8a78b8');rect(o.x+10,y-3,4,3,'#8a78b8')}else{rect(o.x+8,y+10,8,5,'#8a78b8');rect(o.x+10,y+14,4,2,'#8a78b8')}rect(o.x+20,y+8,6,2,'#6b5b95')}
/* ---------- วัดขนาดจริงของตัวละคร (ตัดขอบโปร่งใส) เพื่อให้ทุกตัว/ทุกวัยสูงเท่ากัน ---------- */
const bbCache=new WeakMap();
function petBBox(sh){
  if(bbCache.has(sh))return bbCache.get(sh);
  let r=null;
  try{
    const box=CELL*CFG.SC,oc=document.createElement('canvas');oc.width=oc.height=box;
    const oc2=oc.getContext('2d',{willReadFrequently:true}),tp=new AnimPlayer();
    let x0=1e9,y0=1e9,x1=-1,y1=-1;
    ['idle','walk'].forEach(st=>{   // ไม่นับแถว sick เพราะมีเอฟเฟกต์สูงกว่าตัว
      const rw=ANIM[st].row,fr=sh.fr?sh.fr[rw]:FR;tp.name=st;
      for(let f=0;f<fr;f++){
        oc2.clearRect(0,0,box,box);tp.ffo=f;tp.t=0;tp.draw(oc2,sh,0,0,CFG.SC,false);
        const d=oc2.getImageData(0,0,box,box).data;
        for(let y=0;y<box;y++)for(let x=0;x<box;x++)if(d[(y*box+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
      }
    });
    if(x1>=0)r={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
  }catch(e){r=null}
  if(r)bbCache.set(sh,r);
  return r}
function drawPetD(dt){let saved=false;
  try{const sh=getSheet(P.sp,P.stage,1,accOf(P));if(!sh)throw 0;if(!ap)ap=new AnimPlayer();
    const bb=petBBox(sh);if(!bb)throw 0;
    const air=G.y>0,st=G.state==='dead'?'sick':air?'idle':G.state==='run'?'walk':'idle';ap.play(st);ap.update(dt);
    const k=CFG.TH/bb.h,box=CELL*CFG.SC;     // สเกลให้ความสูงจริงของตัวละคร = TH เท่ากันทุกตัว
    c.save();saved=true;c.translate(PX,GY-G.y+1);
    if(G.duck&&!air&&G.state==='run')c.scale(1,.68);
    c.scale(k,k);
    ap.draw(c,sh,Math.round(-(bb.x+bb.w/2)),Math.round(-(bb.y+bb.h)),CFG.SC,false);c.restore();saved=false}
  catch(e){if(saved)c.restore();rect(PX-CFG.HW/2,GY-G.y-CFG.TH,CFG.HW,CFG.TH,'#ff8fab')}}
function draw(dt){const g=G;
  const sky=c.createLinearGradient(0,0,0,GY);sky.addColorStop(0,'#cfe8ff');sky.addColorStop(1,'#f4e6ff');c.fillStyle=sky;c.fillRect(0,0,W,GY);
  rect(0,GY,W,H-GY,'#c6edc0');rect(0,GY,W,2,'#7fcf7a');
  g.clouds.forEach(k=>{rect(k.x,k.y,26,6,'#fff');rect(k.x+6,k.y-4,14,5,'#fff')});
  for(let i=0;i<9;i++){const x=((i*47-g.dist*.9)%W+W)%W;rect(x,GY+8+(i%3)*7,5,2,'#a8dba2')}
  g.obs.forEach(o=>o.k==='bird'?drawBird(o):drawCactus(o));
  drawPetD(dt);
  if(g.state==='run'&&Math.floor(g.score)%100===0&&g.score>=100)g.flash=.4;
  if(g.flash>0){g.flash-=dt;c.fillStyle='rgba(255,255,255,'+Math.min(.35,g.flash)+')';c.fillRect(0,0,W,H)}}

/* ---------- จบเกม + รางวัล ---------- */
function die(){const g=G;if(g.state==='dead')return;g.state='dead';g.duck=false;
  const sc=Math.floor(g.score),nb=sc>best();if(nb)P.dinoBest=sc;
  let hap=0,coin=0;if(P&&!P.dead){hap=Math.max(CFG.HAP_MIN,Math.min(CFG.HAP_MAX,CFG.HAP_MIN+Math.floor(sc/CFG.HAP_PER)));
    P.hap=clamp(P.hap+hap);P.en=clamp(P.en-CFG.ENERGY);try{coin=Math.min(CFG.COIN_MAX,CFG.COIN_MIN+Math.floor(sc/CFG.COIN_PER));window.dnReward&&window.dnReward(coin)}catch(e){coin=0}try{hs('play')}catch(e){}try{qAdd('play')}catch(e){}try{addBond(1)}catch(e){}try{update()}catch(e){}save(true)}
  paintHud();
  setTimeout(()=>{if(!isOpen)return;const msg=needMsg();
    showOv('<b style="font-size:20px">💥 ชนแล้ว!</b><div style="font-size:22px">คะแนน '+sc+(nb?' 🏆 สถิติใหม่!':'')+'</div><div style="font-size:13px">สูงสุด '+best()+'</div><div>😊 สุข +'+hap+' · ⚡ พลังงาน −'+CFG.ENERGY+(coin?' · 🪙 +'+coin:'')+'</div>'
      +'<div class="row"><button id="dnAgain" class="on" '+(msg?'disabled':'')+'>'+(msg?'พักก่อนนะ':'🔁 เล่นอีกครั้ง')+'</button><button id="dnX">ปิด</button></div>');
    $q('#dnAgain').onclick=()=>{const mm=needMsg();if(mm)return toast(mm);newGame();readyOv();start()};$q('#dnX').onclick=close},700)}

/* ---------- ลูป + การควบคุม ---------- */
function loop(t){if(!isOpen)return;const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;update(dt);draw(dt);paintHud();raf=requestAnimationFrame(loop)}
function act(){if(!G)return;if(G.state==='ready')start();else if(G.state==='run')jumpReq=true}
function onKey(e){if(!isOpen)return;const k=e.key;
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();if(e.type==='keydown'&&!e.repeat)act();else if(e.type==='keydown')jumpReq=true}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();duckHeld=e.type==='keydown'}
  else if(k==='Escape'&&e.type==='keydown')close()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();if((e.clientY-r.top)/r.height>.6&&G&&G.state==='run'){duckHeld=true}else act()});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{duckHeld=false}));
const jb=$q('#dnJump'),db=$q('#dnDuck');
jb.addEventListener('pointerdown',e=>{e.preventDefault();act()});
db.addEventListener('pointerdown',e=>{e.preventDefault();if(G&&G.state==='run')duckHeld=true});
['pointerup','pointercancel','pointerleave'].forEach(n=>db.addEventListener(n,()=>{duckHeld=false}));

function open(){if(!P)return;const msg=needMsg();if(msg)return toast(msg);
