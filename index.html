<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Pets – เลี้ยงสัตว์เลี้ยงแฟนตาซี</title>
<style>
:root{--bg:#fdf3fa;--card:#fff;--ink:#4a3b5c;--mut:#8b7a9e;--line:#eadcf2;--btn:#f3e4ff;--btnh:#e6ccff;--acc:#b78cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1726;--card:#2a2236;--ink:#f1e8fb;--mut:#a998bd;--line:#3b3050;--btn:#3a2d4f;--btnh:#4d3b69;--acc:#c9a6ff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;justify-content:center;padding:12px}
#app{width:100%;max-width:440px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
h1{font-size:20px;margin:4px 0 10px;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--btn);border:2px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;flex:1;min-width:0}
button:hover{background:var(--btnh)}button:disabled{opacity:.45;cursor:not-allowed}
button.on{border-color:var(--acc);background:var(--btnh)}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px}
canvas{image-rendering:pixelated}
input{font:inherit;width:100%;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
#scene{width:100%;border-radius:14px;border:2px solid var(--line);display:block}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.top b{font-size:18px}.mut{color:var(--mut);font-size:13px}
.bar{display:grid;grid-template-columns:76px 1fr 30px;gap:6px;align-items:center;font-size:13px;margin:4px 0}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .4s}
#say{text-align:center;font-size:14px;margin:8px 0 2px;min-height:20px}
#toast{z-index:60;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.item button{flex:0 0 auto;padding:4px 12px}
.mbtn{padding:12px 10px;font-weight:600}
.badge{display:inline-block;min-width:34px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;line-height:18px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,10,35,.55);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mbox{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;width:100%;max-width:420px;max-height:100%;overflow:auto;text-align:center}
.mbox h1{font-size:18px}
.row>input{flex:1 1 140px;width:auto;min-width:0}
.bf{margin:4px 0}.bfh{display:flex;justify-content:space-between;gap:6px;font-size:13px;flex-wrap:wrap;text-align:left}.chips{font-size:11px}
.bbar{position:relative;height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin-top:3px}
.bbar i{display:block;height:100%;background:#ff7a8a;transition:width .35s}.bbar.mp{height:10px}.bbar.mp i{background:#6aa8ff}
.bbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink);text-shadow:0 0 2px var(--card)}
.btlog{min-height:80px;background:var(--btn);border-radius:10px;padding:6px 8px;font-size:12.5px;text-align:left;margin:6px 0}
.btcmd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#btSub{text-align:left;margin-top:8px;max-height:36vh;overflow:auto}
.mbox>.row{position:sticky;bottom:-14px;background:var(--card);padding:8px 0 2px}
.elpg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.elc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));font-size:12px}
.elc:hover{background:color-mix(in srgb,var(--c) 26%,var(--card))}
.elc.sel{outline:3px solid var(--c);outline-offset:1px;background:color-mix(in srgb,var(--c) 34%,var(--card))}
.elE{font-size:26px;line-height:1}
.elgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.elgrid button{text-align:center;padding:8px 6px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0;text-align:center;font-size:13px}
.stats div{display:flex;flex-direction:column;background:var(--btn);border-radius:8px;padding:4px 0}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">

<div id="auth" class="card hide">
  <h1>🔐 เข้าสู่ระบบ</h1>
  <label for="em">อีเมล</label><input id="em" type="email" autocomplete="email">
  <label for="pw">รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:14px"><button id="liBtn" class="on">เข้าสู่ระบบ</button><button id="suBtn">สมัครสมาชิก</button></div>
  <div class="mut" id="authMsg" style="margin-top:10px"></div>
</div>

<div id="setup" class="card">
  <h1>🥚 เลือกสัตว์เลี้ยงของคุณ</h1>
  <div class="row" id="spList"></div>
  <label for="nm">ชื่อ</label><input id="nm" maxlength="12" placeholder="ตั้งชื่อสัตว์เลี้ยง">
  <label>เพศ</label>
  <div class="row"><button id="gM" data-g="M">♂ ชาย</button><button id="gF" data-g="F">♀ หญิง</button></div>
  <div class="row" style="margin-top:14px"><button id="rnd">🎲 สุ่มให้</button><button id="go" class="on">เริ่มเลี้ยง ✨</button></div>
</div>

<div id="game" class="hide">
  <div class="card">
    <div class="top"><b id="hName"></b><span id="hCoin">🪙 0</span></div>
    <div class="mut" id="hInfo"></div>
    <canvas id="scene" width="192" height="120"></canvas>
    <div id="say"></div>
  </div>
  <div class="card" id="bars"></div>
  <div class="card">
    <div class="row" id="actRow" style="margin-bottom:8px">
      <button data-a="feed">🍎 ให้อาหาร</button><button data-a="bath">🛁 อาบน้ำ</button><button data-a="play">⚽ เล่น</button>
    </div>
    <div class="row">
      <button data-a="sleep" id="bSleep">😴 นอน</button><button data-a="heal">💊 รักษา</button>
    </div>
  </div>
  <div class="card" id="menuCard">
    <div class="mut" style="margin-bottom:6px">เมนูเกม</div>
    <div class="row"><button data-a="shop" class="mbtn">🛒 ร้านค้า</button><button data-a="quest" class="mbtn">📋 ภารกิจ <span id="qBadge" class="badge"></span></button><button data-a="info" class="mbtn">🧬 ข้อมูล</button><button data-a="battle" class="mbtn">⚔️ ต่อสู้</button><button data-a="friends" class="mbtn">👥 เพื่อน <span id="frBadge" class="badge hide"></span></button></div>
  </div>
  <div class="card hide" id="panel"></div>
  <div class="row"><button id="reset" style="flex:0 0 auto" class="mut">เริ่มใหม่</button><button id="logout" style="flex:0 0 auto" class="mut">ออกจากระบบ</button></div>
</div>
</div>
<div id="btModal" class="modal hide"><div class="mbox" style="max-width:460px">
  <div class="top"><b id="btTitle"></b><span class="mut" id="btTurn"></span></div>
  <canvas id="btCv" width="256" height="144" style="width:100%;border-radius:12px;border:2px solid var(--line);margin:6px 0"></canvas>
  <div id="btE"></div><div id="btP"></div>
  <div id="btLog" class="btlog"></div>
  <div id="btCmd" class="btcmd"><button data-bt="atk">⚔️ โจมตี</button><button data-bt="def">🛡️ ป้องกัน</button><button data-bt="skill">✨ สกิล</button><button data-bt="item">🎒 ไอเทม</button></div>
  <div id="btSub" class="hide"></div>
  <div id="btEnd" class="hide"></div>
</div></div>
<div id="elModal" class="modal hide"><div class="mbox">
  <h1 id="elTitle" style="margin:0 0 4px"></h1>
  <div class="mut" id="elSub"></div>
  <canvas id="elPrev" width="80" height="80" style="margin-top:8px"></canvas>
  <div id="elInfo" class="mut" style="min-height:40px"></div>
  <div class="elpg" id="elGrid"></div>
  <div class="row"><button id="elLater" class="mut">ไว้ทีหลัง</button><button id="elOk" class="on" disabled>แตะเพื่อเลือกธาตุ</button></div>
</div></div>
<div id="frModal" class="modal hide"><div class="mbox" style="max-width:440px">
  <div class="top"><b id="frTitle"></b><button id="frClose" class="mut" style="flex:0 0 auto;padding:4px 10px">ปิด</button></div>
  <canvas id="frCv" width="192" height="120" style="width:100%;border-radius:12px;border:2px solid var(--line);margin:6px 0"></canvas>
  <div id="frInfo" class="mut"></div>
  <div id="frBars"></div>
  <div class="btcmd" id="frAct" style="grid-template-columns:repeat(2,1fr);margin-top:8px">
    <button data-fr="pat">🤚 ลูบหัว</button><button data-fr="tease">😜 หยอกล้อ</button>
    <button data-fr="feed">🍽️ ให้อาหาร</button><button data-fr="clean">🛁 ทำความสะอาด</button>
    <button data-fr="medicine" style="grid-column:1/3">💊 ป้อนยา</button>
    <button data-fr="duel" style="grid-column:1/3">⚔️ ท้าดวลสัตว์เลี้ยงของเพื่อน</button>
  </div>
  <div id="frSub" class="hide"></div>
  <div id="frMsg" class="mut" style="margin-top:8px;min-height:20px"></div>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};

/* ---------- ข้อมูลสายพันธุ์ / ไอเทม ---------- */
const SP={
  dragon:{n:'มังกร',c:'#ff9fb2',s:'#e27a93',b:'#ffd6a5',h:'#ffe27a',w:'#c7a8ff'},
  slime:{n:'สไลม์',c:'#9fe7d4',s:'#6fc4b0'},
  unicorn:{n:'ยูนิคอร์น',c:'#f6edff',s:'#d2bdf0',m:'#ffa8dc',h:'#ffe27a'}
};
const STAGES=['Baby','Young','Adult','Ascended'];
const FOODS={chili:{n:'🌶️ พริก',price:20,food:20,hap:0,hp:0},soup:{n:'🍲 ซุป',price:25,food:30,hap:5,hp:0},broccoli:{n:'🥦 บล็อคโคลี่',price:20,food:20,hap:0,hp:0},
  choco:{n:'🍫 ช็อกโกแลต',price:20,food:20,hap:0,hp:-5},lime:{n:'🍋‍🟩 มะนาว',price:20,food:20,hap:0,hp:0},bingsu:{n:'🍨 บิงซู',price:25,food:15,hap:10,hp:0},
  lemon:{n:'🍋 เลมอน',price:20,food:15,hap:0,hp:0},blueberry:{n:'🫐 บลูเบอรี่',price:20,food:10,hap:-5,hp:0}};
const foodFx=f=>'อิ่ม +'+f.food+(f.hap?' · สุข '+(f.hap>0?'+':'−')+Math.abs(f.hap):'')+(f.hp?' · สุขภาพ '+(f.hp>0?'+':'−')+Math.abs(f.hp):'');
const TOYS={ball:{n:'⚽ ลูกบอล',price:10,hap:25,en:12}};
const MED={n:'💊 ยารักษา',price:15};
const DAY_MS=5*60000;               // 1 วันในเกม = 5 นาทีจริง
const NAMES=['มะลิ','โมจิ','ฟ้าใส','ลูกพีช','บุ๋ม','ดาว','พุดดิ้ง','ก้อนเมฆ'];

/* ---------- Sprite Sheet (สร้างจากพิกเซลตอนเริ่มเกม) ----------
   แถว = state (idle, eat, sleep, walk, sick) · คอลัมน์ = 4 เฟรม · ช่องละ 16×16 */
const STATES=['idle','eat','sleep','walk','sick','dead','sit'], FR=4, CELL=16;
const ANIM={idle:{row:0,fps:3},eat:{row:1,fps:4},sleep:{row:2,fps:1.5},walk:{row:3,fps:6},sick:{row:4,fps:2},dead:{row:5,fps:2},sit:{row:6,fps:3}};

function drawGrave(c,sp,f){
  const D=SP[sp],ink='#3b2f4a';
  R(c,3,15,10,1,'rgba(0,0,0,.13)');
  R(c,4,7,8,8,'#c9c4d6');R(c,5,6,6,1,'#c9c4d6');R(c,4,14,8,1,'#a9a3bb');
  R(c,7,8,2,5,'#8f89a3');R(c,6,9,4,1,'#8f89a3');
  R(c,2,13,2,2,'#b2e6ae');R(c,12,13,2,2,'#b2e6ae');
  const gy=[2,1,0,1][f];
  R(c,6,gy,4,3,D.c);R(c,6,gy+3,1,1,D.c);R(c,8,gy+(f%2?3:0)+0,1,f%2?1:0,D.c);R(c,9,gy+3,1,1,D.c);
  R(c,7,gy+1,1,1,ink);R(c,9,gy+1,1,1,ink);
}
const hexMix=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),x=p(a),y=p(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lumv=h=>{const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));return .299*r+.587*g+.114*b};
/* ---------- มังกร: พิกเซลดีไซน์ของผู้ใช้ (4 ระยะ) — สีตัวเปลี่ยนตามธาตุ ท่าอื่นสร้างจากภาพเดียวด้วยโค้ด ---------- */
const DRAGON_G=[[".....H......",".....H......","..BBBBBBB...",".BBLLBBBBB..",".BLBBBBBBB..",".BBKBBBKBBT.",".BBKBBBKBBTT",".BPPBBBPPB..",".BBBBRBBBB..","..DBBBBBD...","...DD.DD...."],[".......H........",".......H........","...BBBBBBBBB....","..BLLBBBBBBBB...","EEBLBBBBBBBBBEE.","EEBBBBBBBBBBBEE.","..BBKBBBBBKBB.TT","..BBKBBBBBKBBTT.","..BPPBBBBBBPPB..","..BBBBBRBBBBB...","...DBBBBBBBBD...","....DDDDDDDD...."],["....H.....H.....","....H.....H.....","...BBBBBBBBB....","..BLLBBBBBBBB...","EEBLBBBBBBBBBEE.","EEBBBBBBBBBBBEE.","EEBBBBBBBBBBBEE.","..BBKBBBBBKBB.TT","..BBKBBBBBKBBTT.","..BPPBBBBBBPPB..","..BBBLLRLLBBB...","...DBLLLLLBBD...","....DDDDDDDD...."],["...H.G.G.G.H....","...HGGGWGGGH....","...BBBBBBBBB....","..BLLBBBBBBBB...","FFBLBBBBBBBBBFF.","FFBBBBBBBBBBBFF.","FFBBBBBBBBBBBFF.","..BBKBBBBBKBB.TT","..BBKBBBBBKBBTT.","..BPPBBBBBBPPB..","..BBBLLRLLBBB...","...DBLLLLLBBD...","....DDDDDDDD...."]];
const bodyWH=(sp,st)=>sp==='dragon'?[[7,8],[10,12],[14,13],[16,13]][st]:[[6,5],[8,7],[10,9],[10,9]][st];   // ขนาดตัวจริง (กว้าง,สูง) ใช้คำนวณท่านอนรักษา
function drawDragon(c,st,form,state,f,acc){
  const g=DRAGON_G[st],w=g[0].length,h=g.length,sick=state==='sick',B=sick?'#c5e0a0':(acc||'#ff8fab'),dk=!sick&&lumv(B)<110;
  const pl={B,L:hexMix(B,'#ffffff',.35),D:hexMix(B,'#000000',.3),T:hexMix(B,'#000000',.3),K:dk?'#f4efff':'#241418',P:'#ff9db5',R:dk?'#ffd0d8':'#e0405a',H:'#fff0a8',E:'#c8a4f0',F:'#fff3b0',G:'#ffd23f',W:'#ffffff'};
  let bob=0,xo=0;
  if(state==='idle')bob=[0,0,-1,0][f];if(state==='eat')bob=[0,-1,0,-1][f];
  if(state==='walk'){bob=[0,-1,0,-1][f];xo=w<15?[-1,0,1,0][f]:0}
  if(sick)xo=w<15?[0,-1,0,1][f]:0;
  if(state==='sit')bob=1;
  const ox=((16-w)>>1)+xo,oy=15-h+bob,shut=state==='sleep'||state==='eat'||sick||(state==='idle'&&f===3),at=(x,y)=>(g[y]&&g[y][x])||'.';
  R(c,((16-w)>>1)+3,15,w-6,1,'rgba(0,0,0,.13)');
  if(st===3){for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(at(x,y)==='.'&&[[1,0],[-1,0],[0,1],[0,-1]].some(d=>at(x+d[0],y+d[1])!=='.')&&oy+y<=14)R(c,ox+x,oy+y,1,1,'rgba(255,225,90,.45)')}   // ออร่าทองรอบตัว
  g.forEach((r,y)=>{for(let x=0;x<w;x++){let ch=r[x];if(ch==='.')continue;if(ch==='K'&&shut&&at(x,y+1)==='K')ch='B';R(c,ox+x,oy+y,1,1,pl[ch])}});   // ตาปิด = เหลือแค่พิกเซลล่าง
  if(state==='eat'&&f%2===0)g.forEach((r,y)=>{const x=r.indexOf('R');if(x>=0)R(c,ox+x,oy+y+1,1,1,pl.R)});                                              // อ้าปาก
  if(state==='sleep'){const z=f%2?[12,0]:[13,1];R(c,z[0],z[1],3,1,'#3b2f4a');R(c,z[0]+1,z[1]+1,1,1,'#3b2f4a');R(c,z[0],z[1]+2,3,1,'#3b2f4a')}
  if(sick)R(c,Math.min(15,ox+w),oy+2+(f%2)*2,1,2,'#7ad7ff');
}
function drawCell(c,sp,st,form,state,f,acc){
  if(state==='dead'){drawGrave(c,sp,f);return}
  if(sp==='dragon'){drawDragon(c,st,form,state,f,acc);return}
  const D=SP[sp],S=[{w:6,h:5},{w:8,h:7},{w:10,h:9},{w:10,h:9}][st];
  let bob=0,xo=0,col=D.c,sh=D.s;
  if(acc&&st>=1){col=acc;sh=hexMix(acc,'#000000',.25)}   // เลือกธาตุแล้ว → ร่างเปลี่ยนสีตามธาตุ
  if(state==='idle')bob=[0,0,-1,0][f];
  if(state==='eat')bob=[0,-1,0,-1][f];
  if(state==='sleep')bob=[0,0,1,1][f]*0;
  if(state==='walk'){xo=[-1,0,1,0][f];bob=[0,-1,0,-1][f]}
  if(state==='sit')bob=1;
  if(state==='sick'){col='#c5e0a0';sh='#9bbf78';xo=[0,-1,0,1][f]}
  const x0=Math.round(8-S.w/2)+xo, y0=14-S.h+bob, w=S.w, h=S.h;
  R(c,x0+1,15,w-2,1,'rgba(0,0,0,.13)');
  /* ลำตัว */
  R(c,x0+1,y0,w-2,h,col);R(c,x0,y0+1,w,h-2,col);R(c,x0+1,y0+h-1,w-2,1,sh);
  /* ลักษณะเฉพาะสายพันธุ์ */
  if(sp==='slime'){R(c,x0+(w>>1)-1,y0-1,2,1,col);R(c,x0+1,y0+1,1,1,'#fff')}
  if(sp==='dragon'){
    R(c,x0+1,y0-1,1,2,D.h);R(c,x0+w-2,y0-1,1,2,D.h);
    R(c,x0+w,y0+h-3,2,1,col);R(c,x0+w+1,y0+h-4,1,1,sh);
    if(st>0){R(c,x0-1,y0+2,1,2,D.w);R(c,x0+w,y0+2,1,2,D.w)}

  }

function adultSheet(form,acc){
  const N=192,cv=document.createElement('canvas');cv.width=9*N;cv.height=7*N;
  const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(adultImg,0,0);
  if(acc&&acc!==EL.fire.c){const d=c.getImageData(0,0,cv.width,cv.height);youngTint(d,acc,N,9*N);c.putImageData(d,0,0)}   // ธาตุไฟใช้สีต้นฉบับของภาพ
  const t=document.createElement('canvas');t.width=16;t.height=16;const tc=t.getContext('2d');   // ท่าตาย ใช้หลุมศพเดิม
  for(let f=0;f<4;f++){tc.clearRect(0,0,16,16);drawGrave(tc,'dragon',f);c.drawImage(t,0,0,16,16,f*N+(N-96)/2,5*N+N-96,96,96)}
  cv.fr=[9,4,4,9,9,4,4];cv.cell=N;cv.pix=.2;return cv}
function getSheet(sp,st,form,acc){
  const k=sp+st+form+(acc||''); if(sheets[k])return sheets[k];
  if(sp==='dragon'&&st===0&&babyOK)return sheets[k]=babySheet();
  if(sp==='dragon'&&st===1&&youngOK)return sheets[k]=youngSheet(form,acc);
  if(sp==='dragon'&&st===2&&adultOK)return sheets[k]=adultSheet(form,acc);
  const cv=document.createElement('canvas');cv.width=FR*CELL;cv.height=STATES.length*CELL;
  const c=cv.getContext('2d');
  STATES.forEach((s,r)=>{for(let f=0;f<FR;f++){c.save();c.translate(f*CELL,r*CELL);c.beginPath();c.rect(0,0,CELL,CELL);c.clip();drawCell(c,sp,st,form,s,f,acc);c.restore()}});
  return sheets[k]=cv;
}

/* ---------- Animation Player: เล่นเฟรมตามลำดับ/ความเร็ว ---------- */
class AnimPlayer{
  constructor(){this.name='idle';this.t=0;this.f=0}
  play(n){if(n!==this.name){this.name=n;this.t=0;this.f=0}}
  update(dt){this.t+=dt;this.f=Math.floor(this.t*ANIM[this.name].fps)%FR}
  draw(ctx,sheet,x,y,scale,flip){
    ctx.save();ctx.imageSmoothingEnabled=false;
    if(flip){ctx.translate(x+CELL*scale,y);ctx.scale(-1,1);x=0;y=0}
    const box=CELL*scale,cs=sheet.cell||CELL,dsz=sheet.pix?cs*Math.max(1,Math.round(scale*sheet.pix)):box,dx=(box-dsz)/2,dy=box-dsz;   // ชีตที่เล็กกว่ากล่อง (เช่น เบบี้) วาดชิดล่างกึ่งกลาง
    const rw=ANIM[this.name].row,fr=sheet.fr?sheet.fr[rw]:FR,ff=sheet.fr?Math.floor(this.t*ANIM[this.name].fps*fr/FR)%fr:this.f;
    ctx.drawImage(sheet,ff*cs,rw*cs,cs,cs,(flip?0:x)+dx,(flip?0:y)+dy,dsz,dsz);
    ctx.restore();
  }
}
/* ---------- Animation Controller: Game State → ชื่อ animation ---------- */
function chooseAnim(p,now){
  if(p.dead)return 'dead';
  if(p.healLeft>0)return p.healLeft/HEAL_SEC>.4?'sick':'sleep';   // รักษา: ป่วยก่อน แล้วหลับสบาย               // ตายแล้ว
  if(now<rt.eatUntil)return 'eat';
  if(now<rt.playUntil&&rt.playItem==='ball')return 'walk';    // เล่นบอล → วิ่งเลี้ยงบอล       // ผู้เล่นกดให้อาหาร
  if(p.sleeping)return 'sleep';          // พลังงานหมด / สั่งนอน
  if(p.sick)return 'sick';
  if(now<rt.walkUntil)return 'walk';
  return 'idle';                         // ไม่มีคำสั่ง
}

function canAscend(p){const o=ascOpts(p);return p.stage===2&&p.lv>=ASC.lv&&evoScore(p)>=ASC.score&&(o.boss||o.item||o.gene)}

  P.stage=3;P.careSum=P.careN=0;addXp(50);toast('🌟 '+P.name+' วิวัฒนาการเป็น Ascended!');renderPanel();update();save()}

/* ---------- รายได้เหรียญ: ภารกิจรายวัน · โบนัสเข้าเกม · รายได้จากการดูแลดี · โบนัสวิวัฒนาการ ---------- */
const dayKey=(off=0)=>new Date(Date.now()+7*3600e3+off).toISOString().slice(0,10);   // วันตามเวลา Asia/Bangkok
const QUESTS=[{k:'feed',n:'🍎 ให้อาหาร 3 ครั้ง',need:3,coin:15},{k:'bath',n:'🛁 อาบน้ำ 1 ครั้ง',need:1,coin:10},{k:'play',n:'⚽ เล่นด้วย 3 ครั้ง',need:3,coin:15},{k:'fight',n:'⚔️ ชนะการต่อสู้ 1 ครั้ง',need:1,coin:20}];
function qState(){if(!P.q||P.q.day!==dayKey())P.q={day:dayKey(),feed:0,bath:0,play:0,fight:0,done:{}};return P.q}
function qAdd(k){const q=qState(),d=QUESTS.find(x=>x.k===k);q[k]=(q[k]||0)+1;
  if(q[k]>=d.need&&!q.done[k]){q.done[k]=1;P.coins+=d.coin;addXp(10);toast('📋 ภารกิจสำเร็จ! +'+d.coin+' 🪙')}}
function dailyBonus(){
  if(!P||P.dead)return;const d=dayKey();if(P.lastDay===d)return;
  P.streak=(P.lastDay===dayKey(-864e5))?(P.streak||0)+1:1;P.lastDay=d;
  const c=10+Math.min(P.streak,7)*3;P.coins+=c;toast('🎁 โบนัสเข้าเกมวันนี้ +'+c+' 🪙 (ต่อเนื่อง '+P.streak+' วัน)');
}
const BATH_RATE=1,BATH_HAP=0.05,HEAL_SEC=8;   // อาบน้ำ: ความสะอาดเพิ่ม BATH_RATE ต่อวินาที หยุดเองเมื่อครบ 100
function step(p,sec,safe){
  if(p.dead)return;
  const m=sec/60,s=p.sleeping;
  if(p.healLeft>0){p.healLeft-=sec;p.bathing=false;if(p.healLeft<=0){p.healLeft=0;p.sick=false;p.hp=clamp(p.hp+30);hs('heal');addXp(5);addBond(2);toast('💊 หายป่วยแล้ว!')}}
  if(p.bathing){if(p.sleeping)p.bathing=false;else{const b=Math.min(sec,Math.max(0,100-p.clean)/BATH_RATE);p.clean+=BATH_RATE*b;p.hap-=BATH_HAP*b;
    if(p.clean>=99.99){p.clean=100;p.bathing=false;hs('bath');addXp(3);addBond(1);toast('✨ อาบน้ำเสร็จแล้ว ตัวสะอาด 100')}}}
  const tf=p.trait==='lowfood'?.75:1,tp=p.trait==='playful'?.75:1,tt=p.trait==='tidy'?.75:1;   // ลักษณะพิเศษ
  p.food-=(s?1.5:3)*m*tf;p.hap-=(s?.5:2)*m*tp;p.clean-=(s?.5:2)*m*tt;p.en+=s?20*m*(p.trait==='fastrest'?1.4:1):-1.5*m;
  if(p.sick){p.hp-=2*m;p.hap-=2*m}
  else if((p.clean<25||p.hp<35)&&Math.random()<Math.min(1,.15*m*(p.trait==='hardy'?.6:1)))p.sick=true;
  const bad=p.food<15||p.clean<15||p.en<8;
  if(bad)p.hp-=3*m; else if(!p.sick&&p.food>50&&p.clean>50&&p.hap>50&&p.en>30)p.hp+=2*m;
  if(p.en<=0)p.sleeping=true; if(p.sleeping&&p.en>=100)p.sleeping=false;
  ['food','hap','clean','en'].forEach(k=>p[k]=clamp(p[k]));if(p.stage===0)p.minClean=Math.min(p.minClean==null?100:p.minClean,p.clean);
  p.hp=clamp(p.hp,safe?5:0,100);if(p.hp<=0)die(p,'สุขภาพทรุดโทรม');                       // ตายเมื่อสุขภาพเป็น 0 (ช่วงปิดเกมไว้จะไม่ตายจากสุขภาพ)
  if(!p.sick&&p.food>=60&&p.hap>=60&&p.clean>=60&&p.en>=60&&p.hp>=60){   // ดูแลดี ทุกค่า ≥ 60 → 1 เหรียญ/นาที
    p.cf=(p.cf||0)+m*(p.trait==='lucky'?1.2:1);const w=Math.floor(p.cf);if(w>0){p.coins+=w;p.cf-=w}}
  p.bond=clamp((p.bond||0)+((!p.sick&&p.food>=60&&p.hap>=60&&p.clean>=60&&p.en>=60&&p.hp>=60)?.3:(p.hap<30||p.food<20?-.4:0))*m);   // ความผูกพัน
  p.careSum+=(p.food+p.hap+p.clean+p.en+p.hp)/5*sec;p.careN+=sec;p.lifeSum=(p.lifeSum||0)+(p.food+p.hap+p.clean+p.en+p.hp)/5*sec;p.lifeN=(p.lifeN||0)+sec;
}
function die(p,why){p.dead=true;p.cause=why;p.diedAt=Date.now();p.sleeping=false;p.sick=false;rt.panel=null;toast('🪦 '+p.name+' จากไปแล้ว ('+why+')');renderPanel();save()}
function lifespanDays(p){return 80}   // อายุขัย 80 วัน (1 วัน = 5 นาที) — เลื่อนเลเวลต้องใช้เวลานาน
function stageFor(p){return p.lv<10?0:p.lv<25?1:2}   // Lv.10 → Young · Lv.25 → Adult (Ascended ต้องกดเอง)

/* ===== โหมดนักพัฒนา: ปุ่มวิวัฒนาการทันที (เปิดด้วย ?dev=1 หรือ Ctrl+Shift+D) ===== */

/* ---------- อนิเมชันเล่น: ลูกบอล (เลี้ยงไปมา) ---------- */
function drawBall(ctx,x,y,r,ang){   // ลูกฟุตบอลลายขาว-ดำ
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
  ctx.fillStyle='#fff';ctx.fillRect(-r,-r,2*r,2*r);
  const pent=(cx,cy,pr,rot)=>{ctx.beginPath();for(let i=0;i<5;i++){const a=rot+i*Math.PI*2/5;ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*pr,cy+Math.sin(a)*pr)}ctx.closePath();ctx.fill()};
  ctx.strokeStyle='#9a96a8';ctx.lineWidth=1;
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.38,Math.sin(a)*r*.38);ctx.lineTo(Math.cos(a)*r*.72,Math.sin(a)*r*.72);ctx.stroke()}
  ctx.fillStyle='#2b2535';pent(0,0,r*.4,-Math.PI/2);
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;pent(Math.cos(a)*r,Math.sin(a)*r,r*.42,a+Math.PI)}
  ctx.restore();
  ctx.strokeStyle='#2b2535';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}
function drawPlay(ctx,now){
  const k=rt.playItem;if(!k||now>=rt.playUntil)return;
  const t=Math.max(0,Math.min(1,1-(rt.playUntil-now)/rt.playDur)),cx=rt.x+40;
  if(k==='ball'){
    const wh=bodyWH(P.sp,P.stage),r=Math.round(Math.min(10,wh[1]*.8)),off=Math.min(52,wh[0]*2.5+r+11);   // ขนาดบอลและระยะห่างตามขนาดตัว (เบบี้ใช้บอลเล็กลง)
    const bx=cx+rt.bd*(off+10*Math.sin(now/150)),by=101-r-Math.abs(Math.sin(now/170))*14*(r/10);
    ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(Math.round(bx-r*.8),101,Math.round(r*1.6),2);
    drawBall(ctx,bx,by,r,now/130*rt.bd);
  }
}

/* ---------- Turn-Based Combat: Pet 1 ตัว ต่อ ศัตรู 1 ตัว ---------- */
const BT_COST=[6,14,26],BT_DMG=.5;   // ตัวคูณความเสียหาย: ปรับความยาวของการต่อสู้
const SKFX={fire:[{st:['burn',.3]},{st:['burn',.5]},{st:['burn',1]}],water:[{},{heal:.1},{heal:.2}],nature:[{st:['poison',.3]},{st:['poison',.7]},{heal:.35,nodmg:1}],
  earth:[{},{buf:['def_up',3]},{st:['stun',.3]}],electric:[{st:['para',.2]},{hits:2,mul:.6},{st:['slow',1]}],ice:[{st:['slow',.3]},{st:['slow',1]},{st:['stun',.6]}],
  light:[{cleanse:1},{heal:.2,cleanse:1,nodmg:1},{heal:.15,cleanse:1,buf:['atk_up',3]}],shadow:[{},{buf:['evade_up',2]},{ign:.5}]};

  {id:'cave',n:'⛰️ ถ้ำใต้ภูเขา',lv:20,es:1,k:1.27,bk:1.28,els:['earth','ice','shadow']},{id:'peak',n:'🌋 ยอดเขาไฟ',lv:30,es:2,k:1.12,bk:1.39,els:['fire','electric','earth']}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bEff=(f,k)=>f.s[k]*(k==='atk'&&f.st.atk_up?1.25:1)*(k==='def'&&f.st.def_up?1.3:1)*(k==='spd'&&f.st.slow?.7:1);
function bSkills(f){return f.el?EVO.skills[f.el].map((x,i)=>({...x,i,cost:BT_COST[i],fx:SKFX[f.el][i],e:f.el})).filter(x=>x.s<=f.stage):[]}
function mkFighter(o){const mpMax=Math.round(20+o.s.mag*1.5);return{...o,hpMax:o.hp,mpMax,mp:Math.round(mpMax*.6),st:{},defend:false}}
function petFighter(p){const st=calcStats(p),hp=Math.max(10,Math.round(st.hp*(.5+p.hp/200)));   // สุขภาพต่ำ → HP สูงสุดลดลง
  return mkFighter({isPet:true,role:p.role,name:p.name,sp:p.sp,stage:p.stage,lv:p.lv,el:p.el,bond:p.bond||0,hp,s:st})}
function enemyFighter(a,boss){const sp=['dragon','slime','unicorn'][Math.random()*3|0],el=boss?a.els[0]:a.els[Math.random()*a.els.length|0];
  const lv=boss?a.lv+4:a.lv+(Math.random()*3|0),stg=boss?Math.min(3,a.es+1):a.es;
  const p={sp,el,el2:null,stage:stg,lv,genes:{hp:8,atk:8,def:8,spd:8,mag:8,luk:8},trait:null},st=calcStats(p),k=boss?(a.bk||a.k*1.15):a.k;
  KEYS.forEach(q=>st[q]=Math.round(st[q]*k));
  return mkFighter({isPet:false,boss,name:(boss?'👑 ':'')+EL[el].e+' '+speciesName(p),sp,stage:stg,lv,el,hp:st.hp,s:st})}
let bt=null,btOn=false;
function btNew(a,boss){bt={area:a,boss,p:petFighter(P),e:enemyFighter(a,boss),turn:0,over:false,win:false,busy:false,log:[]};return bt}
function btSnap(){const f=x=>Object.keys(x.st).map(k=>STN[k]);return{ph:bt.p.hp,pm:bt.p.mp,eh:bt.e.hp,em:bt.e.mp,ps:f(bt.p),es:f(bt.e)}}
function btAI(){const e=bt.e,p=bt.p;let sk=bSkills(e).filter(s=>e.mp>=s.cost&&!(s.fx.nodmg&&e.hp>e.hpMax*.7));
  if(e.hp<e.hpMax*.35){const h=sk.find(s=>s.fx.heal);if(h&&Math.random()<.6)return{t:'skill',s:h};if(Math.random()<.2)return{t:'def'}}
  if(e.boss&&bt.turn%3===0&&sk.length)return{t:'skill',s:sk.reduce((a,b)=>b.p>a.p?b:a)};
  if(sk.length&&Math.random()<(e.boss?.55:.4)){const adv=sk.filter(s=>mult(s.e,p.el)>1),pool=adv.length&&Math.random()<.7?adv:sk;return{t:'skill',s:pool[Math.random()*pool.length|0]}}
  return{t:'atk'}}
function btStep(cmd){   // ประมวลผล 1 เทิร์น → คืนรายการเหตุการณ์ให้ UI เล่นทีละอัน
  const p=bt.p,e=bt.e,ev=[];bt.turn++;
  const side=f=>f===bt.p?'p':'e',push=o=>{o.s=btSnap();ev.push(o)},msg=t=>push({k:'msg',t});
  const heal=(f,n)=>{n=Math.min(Math.round(n*(f.role==='sup'?1.2:1)),f.hpMax-f.hp);if(n>0){f.hp+=n;if(f===p)hs('healed',n);push({k:'heal',who:side(f),amt:n})}};
  const addSt=(f,n,t)=>{if(f.hp<=0)return;f.st[n]=Math.max(f.st[n]||0,t);if(f===p&&['burn','poison','para','slow','stun'].includes(n))hs('afflicted');msg(f.name+' '+STN[n])};

function ygFrame(t){const T=FLAME_T;   // 0 ยืนเตรียม → 1 อ้าปากสูดลม → 2 ควัน → 3 จุดไฟในปาก → 4/5 สายไฟสั้น/ยาว → ผ่อนลม
  if(t<T.inh*.5)return 0;if(t<T.inh)return 1;if(t<T.ign)return 2;if(t<T.rel)return 3;
  if(t<T.str){const n=((t-T.rel)/110)|0;return n===0||n%3===0?4:5}
  return t<T.str+200?2:1}
function drawYgFlame(c,v,who,now,x,y,flip){
  if(!flameYOK||!v.fx)return false;const f=v.fx.find(q=>q.who===who&&q.sprY);if(!f)return false;
  const t=now-f.t0;if(t<0||t>=FLAME_T.end)return false;
  const i=ygFrame(t),CW=176,CH=96,jy=i>=4?Math.round(Math.sin(now/55)):0;c.save();   // ตอนพ่นไฟสั่นขึ้นลงเล็กน้อย
  if(flip){c.translate(x+96,y);c.scale(-1,1)}else c.translate(x,y);
  c.drawImage(flameYImg,i*CW,0,CW,CH,-8,jy,CW,CH);   // กล่องสไปรต์ 80 อยู่ที่ (8,16) ในกล่อง 96 → ช่องเริ่มที่ (-8,0)
  c.restore();return true}
function flameLean(v,who,now){ // ตัวเอนไปหลังตอนสูดลม แล้วพุ่งไปหน้าตอนพ่น (หน่วยพิกเซลแคนวาส)
  let o=0;if(v.fx)for(const f of v.fx){if(f.who!==who||f.spr||f.sprY)continue;const t=now-f.t0,T=FLAME_T,d=who==='p'?1:-1;
    if(t<T.inh)o=-d*3*(t/T.inh);else if(t<T.rel)o=-d*3;else if(t<T.str)o=d*3;else if(t<T.end)o=d*3*(1-(t-T.str)/(T.end-T.str))}
  return o}

    const t=now-f.t0,T=FLAME_T,d=f.who==='p'?1:-1,M=(f.who==='p'?FLAME_MP:FLAME_ME)[Math.min(3,f.st||0)],mx=M[0]+flameLean(v,f.who,now),my=M[1],P=4,fr=(t/70)|0;
    const sq=(x,y,w,h,col)=>R(c,Math.round(x/P)*P,Math.round(y/P)*P,w,h,col);
    const smoke=(k,age,ox,oy,max)=>{const a=Math.min(1,age/max);if(a<0||a>1)return;const r=P*(1+Math.floor(a*2.5)),px=mx+d*(ox+a*8*(k%2?1:.6)),py=my+oy-a*18;

/* ---------- ระบบสังคม: เพื่อน · เยี่ยมสัตว์เลี้ยง · ช่วยดูแล (Co-care) — ใช้ได้เมื่อล็อกอิน Supabase เท่านั้น ---------- */
const SOC_AWAY=180;   // เจ้าของไม่ได้อัปเดตภาพรวมเกิน 3 นาที = "ไม่อยู่"
const soc={me:null,friends:[],incoming:[],outgoing:[],ready:false,busy:false,visit:null,started:false,err:''};
function socReset(){soc.ready=false;soc.me=null;soc.friends=[];soc.incoming=[];soc.outgoing=[];soc.err='';soc.visit=null;visitOn=false;$('#frModal').classList.add('hide')}   // สลับบัญชี
const socOn=()=>!!(typeof sb!=='undefined'&&sb&&typeof user!=='undefined'&&user);
async function socCall(fn,args){try{const r=await sb.rpc(fn,args||{});if(r.error){console.warn('social',fn,r.error.message);return{ok:false,msg:r.error.message}}return r.data}catch(e){return{ok:false,msg:String(e.message||e)}}}
function applyKind(T,k,p,mine){   // ผลของการกระทำของเพื่อน (ใช้กับสัตว์เลี้ยงจริง mine=true หรือกับตัวประมาณการที่เพื่อนเห็น)
  const bond=n=>{if(mine)addBond(n);else T.bond=clamp((T.bond||0)+n)};
  if(k==='pat'){T.hap=clamp(T.hap+4);bond(1);return k}
  if(k==='tease'){T.hap=clamp(T.hap+3);bond(1);return k}
  if(k==='feed'){const f=FOODS[(p||{}).food];if(!f)return null;T.food=clamp(T.food+f.food);T.hap=clamp(T.hap+f.hap+2);if(f.hp)T.hp=clamp(T.hp+f.hp,1,100);return k}
  if(k==='clean'){T.clean=clamp(T.clean+45);return k}
  if(k==='medicine'){if(T.sick){T.sick=false;T.hp=clamp(T.hp+30)}else T.hp=clamp(T.hp+5);return k}
  if(k==='thanks'||k==='duel')return k;
  return null}
const socText=(a,pn)=>{const n=a.from_name||'เพื่อน',f=FOODS[(a.payload||{}).food];
  return({pat:n+' ลูบหัว '+pn+' 💖',tease:n+' มาหยอก '+pn+' 😆',feed:n+' ให้'+(f?f.n:'อาหาร')+'กับ '+pn+' 🍽️',clean:n+' ช่วยทำความสะอาดให้ '+pn+' 🫧 ขอบคุณเพื่อนนะ!',
    medicine:n+' ป้อนยาให้ '+pn+' 💊 ขอบคุณเพื่อนนะ!',duel:n+' มาประลองกับ '+pn+' ⚔️ — '+((a.payload||{}).win?n+' ชนะ':pn+' ป้องกันบ้านสำเร็จ! 🏆'),thanks:n+' ขอบคุณที่ช่วยดูแลสัตว์เลี้ยงของเขา 💝 (ได้แต้มมิตรภาพ +2)'})[a.kind]||''};
function socApplyOne(a,online){
  if(!P)return;if(P.dead&&a.kind!=='thanks')return;
  if(!applyKind(P,a.kind,a.payload||{},true))return;
  const txt=socText(a,a.kind==='thanks'?'สัตว์เลี้ยง':P.name);
  P.notes=P.notes||[];P.notes.unshift({id:a.id,from:a.from_id,name:a.from_name||'เพื่อน',kind:a.kind,txt,at:Date.now(),th:false});if(P.notes.length>30)P.notes.length=30;
  P.noteNew=(P.noteNew||0)+1;
  if(online){toast('💌 '+txt);rt.socFx={t0:performance.now(),kind:a.kind};if(a.kind==='clean')rt.bubUntil=performance.now()+2500;
    if(a.kind==='feed'&&FOODS[(a.payload||{}).food]){rt.eatItem=a.payload.food;rt.eatUntil=Date.now()+EAT_MS}}}
function socCatchUp(acts){   // จำลองเวลาที่ปิดเกมไว้ โดยใส่การกระทำของเพื่อนตามเวลาจริงที่เกิดขึ้น
  const end=Date.now(),cap=8*3600*1000;let t=Math.max(P.last||end,end-cap);
  const run=to=>{let el=(to-t)/1000;while(el>0){step(P,Math.min(60,el),true);el-=60}t=Math.max(t,to)};
  (acts||[]).map(a=>({...a,ts:Math.min(end,Math.max(new Date(a.at).getTime()||end,t))})).sort((x,y)=>x.ts-y.ts).forEach(a=>{run(a.ts);socApplyOne(a,false)});
  run(end)}

function visitLoop(t){if(!visitOn||!soc.visit)return;requestAnimationFrame(visitLoop);const V=soc.visit,c=$('#frCv').getContext('2d'),now=performance.now(),dt=Math.min(.1,(t-(V.lt||t))/1000);V.lt=t;
  if(now-V.lastBar>1000){V.lastBar=now;renderVisit()}
  c.imageSmoothingEnabled=false;['#cfeaff','#dff1ff','#f4e6ff','#ffe8f4'].forEach((col,i)=>R(c,0,i*21,192,22,col));R(c,0,86,192,34,'#c9f0c6');R(c,0,86,192,3,'#b2e6ae');R(c,0,104,192,16,'#b9e4b6');
  const pet=V.fr.pet,e=V.est,sheet=getSheet(pet.sp,pet.stage,1,pet.el?EL[pet.el].c:null);
  let a=pet.dead?'dead':e.sleeping?'sleep':e.sick?'sick':'idle';if(now<V.eatUntil)a='eat';else if(now<V.teaseUntil)a='walk';
  V.pa.play(a);V.pa.update(dt);const jx=now<V.teaseUntil?Math.round(Math.sin(now/45)*3):0;
  V.pa.draw(c,sheet,56+jx,26,5,false);
  c.font='18px sans-serif';c.textAlign='center';V.fl=V.fl.filter(f=>now-f.t0<1400);
  V.fl.forEach(f=>{const k=(now-f.t0)/1400;c.globalAlpha=1-k*k;c.fillText(f.e,f.x+Math.sin(now/200+f.x)*4,f.y-k*40)});c.globalAlpha=1}
async function socAct(kind,payload){const V=soc.visit;if(!V||soc.busy)return;
  if(kind==='feed'&&!(P.inv[(payload||{}).food]>0))return;if(kind==='medicine'&&!(P.inv.med>0))return;
  soc.busy=true;const r=await socCall('social_act',{p_to:V.fr.id,p_kind:kind,p_payload:payload||{}});soc.busy=false;
  const msg=$('#frMsg');if(!r||!r.ok){msg.textContent='⚠️ '+((r&&r.msg)||'ไม่สำเร็จ');return}
  if(kind==='feed')P.inv[payload.food]--;if(kind==='medicine')P.inv.med--;
  V.fr.acts.push({kind,payload:payload||{}});V.fr.pair_points=(V.fr.pair_points||0)+r.gained;soc.me.points=(soc.me.points||0)+(r.gained||0);
  const now=performance.now(),emo={pat:'💖',tease:'😆',feed:'🍽️',clean:'🫧',medicine:'💊'}[kind];for(let i=0;i<4;i++)V.fl.push({e:emo,x:70+i*18,y:92-i*6,t0:now+i*80});
  if(kind==='feed')V.eatUntil=now+2200;if(kind==='tease')V.teaseUntil=now+1500;
  msg.textContent='✅ '+({pat:'ลูบหัวแล้ว',tease:'หยอกล้อแล้ว',feed:'ให้อาหารแล้ว',clean:'ช่วยทำความสะอาดแล้ว',medicine:'ป้อนยาแล้ว'})[kind]+' · ได้แต้มมิตรภาพ +'+r.gained+' 💞'+(kind==='clean'||kind==='medicine'?' (เจ้าของจะได้รับแจ้งเตือน)':'');
  addXp(2);save();renderVisit()}
function socFeedMenu(){const V=soc.visit;if(!V)return;const ks=Object.keys(FOODS).filter(k=>P.inv[k]>0);
  $('#frSub').innerHTML=(ks.length?ks.map(k=>'<div class="item"><span>'+FOODS[k].n+' ×'+P.inv[k]+'<br><span class="mut">'+foodFx(FOODS[k])+'</span></span><button data-frfood="'+k+'">ให้</button></div>').join(''):'<div class="mut">ไม่มีอาหารในกระเป๋า (ซื้อได้ที่ร้านค้า)</div>')+'<div class="row" style="margin-top:6px"><button data-fr="back">ย้อนกลับ</button></div>';
  $('#frSub').classList.remove('hide')}
$('#frModal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(b.id==='frClose')return socCloseVisit();
  if(d.frfood){$('#frSub').classList.add('hide');return socAct('feed',{food:d.frfood})}
  if(d.fr==='back')return $('#frSub').classList.add('hide');
  if(d.fr==='feed')return socFeedMenu();
  if(d.fr==='duel')return socDuel();
  if(d.fr)return socAct(d.fr,{})});
function friendFighter(d){   // สร้างคู่ต่อสู้จากข้อมูลสัตว์เลี้ยงของเพื่อน (ใช้สูตรสเตตัสเดียวกับเกม)
  return petFighter({name:'🏠 '+(d.name||'เพื่อน'),sp:d.sp,stage:d.stage||0,lv:d.lv||1,el:d.el||null,el2:null,role:d.role||null,sub:d.sub==null?null:d.sub,
    genes:d.genes||{hp:8,atk:8,def:8,spd:8,mag:8,luk:8},trait:d.trait||null,hp:d.hp==null?100:d.hp,bond:d.bond||0})}
async function socDuel(){const V=soc.visit;if(!V||soc.busy)return;const fr=V.fr,err=btReady();
  if(err){$('#frMsg').textContent='⚠️ '+err;return}
  soc.busy=true;const r=await socCall('social_duel_check',{p_to:fr.id});soc.busy=false;
  if(!r||!r.ok){$('#frMsg').textContent='⚠️ '+((r&&r.msg)||'ท้าดวลไม่ได้');return}
  const d=r.pet;socCloseVisit();rt.panel=null;renderPanel();P.en=clamp(P.en-15);
  bt={area:{id:'duel',n:'⚔️ ดวลกับ '+fr.name},boss:false,p:petFighter(P),e:friendFighter(d),turn:0,over:false,win:false,busy:false,log:[],duel:{to:fr.id,name:fr.name,pet:d.name||''}};btOpen()}
async function socDuelReport(r){const D=bt&&bt.duel;if(!D||!socOn())return;
  const res=await socCall('social_act',{p_to:D.to,p_kind:'duel',p_payload:{win:!!r.win,pet:D.pet}}),el=$('#btEnd');if(!el)return;
  if(res&&res.ok){soc.me.points=(soc.me.points||0)+(res.gained||0);const fr=soc.friends.find(f=>f.id===D.to);if(fr)fr.pair_points=(fr.pair_points||0)+(res.gained||0);
    el.insertAdjacentHTML('afterbegin','<div class="mut">💞 แต้มมิตรภาพ +'+res.gained+' · '+esc(D.name)+' จะได้รับแจ้งผลดวล</div>')}
  else el.insertAdjacentHTML('afterbegin','<div class="mut">⚠️ '+esc((res&&res.msg)||'บันทึกผลดวลไม่สำเร็จ')+'</div>')}
function drawSocFx(c,now){const f=rt.socFx;if(!f||now>f.t0+2200)return;const t=(now-f.t0)/2200,em={pat:'💖',tease:'😆',feed:'🍽️',clean:'🫧',medicine:'💊',thanks:'💝'}[f.kind]||'💬';
  c.font='16px sans-serif';c.textAlign='center';c.globalAlpha=1-t*t;for(let i=0;i<3;i++)c.fillText(em,rt.x+26+i*14,72-t*38-i*7+Math.sin(now/150+i)*3);c.globalAlpha=1}

/* ---------- Render loop ---------- */
const cv=$('#scene'),ctx=cv.getContext('2d'),player=new AnimPlayer();let lastT=0;
function scene(now){
  ctx.imageSmoothingEnabled=false;
  const bands=['#cfeaff','#dff1ff','#f4e6ff','#ffe8f4'];bands.forEach((c,i)=>R(ctx,0,i*25,192,26,c));
  R(ctx,20,18,26,6,'#fff');R(ctx,26,14,14,5,'#fff');R(ctx,130,30,24,6,'#fff');R(ctx,136,26,12,5,'#fff');
  R(ctx,0,86,192,34,'#c9f0c6');R(ctx,0,86,192,3,'#b2e6ae');R(ctx,0,104,192,16,'#b9e4b6');
  [[30,96],[150,100],[96,110]].forEach(([x,y])=>{R(ctx,x,y,2,2,'#fff');R(ctx,x-1,y+1,4,1,'#ffd1e6')});
  if(P.sleeping||P.dead)R(ctx,0,0,192,120,'rgba(40,30,80,.28)');
}
function frame(t){
  const dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;if(!P){requestAnimationFrame(frame);return}
  const now=Date.now(),a=chooseAnim(P,now);player.play(a);player.update(dt);
  if(P.healLeft>0)rt.x+=(56-rt.x)*Math.min(1,dt*4);   // เดินไปที่เตียงกลางฉาก
  if(a==='walk'){rt.x+=rt.dir*((now<rt.playUntil&&rt.playItem==='ball')?36:22)*dt;const bp=now<rt.playUntil&&rt.playItem==='ball';
    if(bp){if(rt.x<26)rt.dir=1;if(rt.x>86)rt.dir=-1}   // เล่นบอล: เหลือที่ให้ลูกบอลด้านข้าง
    else{if(rt.x<6){rt.x=6;rt.dir=1}if(rt.x>106){rt.x=106;rt.dir=-1}}}
  scene(t);if(P.healLeft>0)drawHealBack(ctx,now);
  const sheet=getSheet(P.sp,P.stage,1,accOf(P));
  if(P.healLeft>0){   // รักษา: หมุนตัว 90° ให้นอนบนเตียง หัวอยู่ทางหมอน
    const [w,h]=bodyWH(P.sp,P.stage),k=Math.min(1,62/(w*5)),rel=(14-h/2-8)*5*k;
    ctx.save();ctx.translate(Math.round(rt.x+30-rel),Math.round(97-w*2.5*k));ctx.rotate(-Math.PI/2);ctx.scale(k,k);player.draw(ctx,sheet,-40,-40,5,false);ctx.restore();
  }else player.draw(ctx,sheet,rt.x,26,5,rt.dir<0&&a==='walk');
  if(now<rt.eatUntil&&rt.eatItem)drawFood(ctx,rt.eatItem,rt.x,now);
  rt.bd=(rt.bd||0)+(rt.dir-(rt.bd||0))*Math.min(1,dt*5);   // ให้ลูกบอลสลับข้างอย่างนุ่มนวล
  drawPlay(ctx,now);if(P.healLeft>0)drawHealFront(ctx,now);drawSocFx(ctx,now);
  if(P.bathing||now<(rt.bubUntil||0))for(let i=0;i<7;i++){const bx=rt.x+10+i*9,by=90-((now/12+i*23)%55);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bx,by,2+(i%3),0,7);ctx.stroke()}
  requestAnimationFrame(frame);
}
setInterval(()=>{ // ทุก 1 วินาที
  if(!P)return;const now=Date.now();step(P,(now-P.last)/1000);P.last=now;
  if(!P.sleeping&&!P.sick&&now>rt.walkUntil&&Math.random()<.06){rt.walkUntil=now+2500+Math.random()*2000;rt.dir=Math.random()<.5?-1:1}
  checkEvolve();dailyBonus();update();if(rt.panel==='shop'||rt.panel==='quest')renderPanel();
},1000);
setInterval(()=>P&&save(),15000);

/* ---------- Setup ---------- */
function buildSetup(){
  $('#spList').innerHTML=Object.keys(SP).map(k=>`<button class="sp" data-sp="${k}"><canvas width="64" height="64" id="pv_${k}"></canvas>${SP[k].n}<span class="mut">ปลดล็อกธาตุที่ Lv.10</span></button>`).join('');
  drawPreviews();
  syncPick();
}
function drawPreviews(){Object.keys(SP).forEach(k=>{const e=$('#pv_'+k);if(!e)return;const c=e.getContext('2d'),s=getSheet(k,1,1),cs=s.cell||16;c.clearRect(0,0,64,64);c.imageSmoothingEnabled=!!s.cell;c.drawImage(s,0,0,cs,cs,0,0,64,64)})}
function syncPick(){document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',b.dataset.sp===pick.sp));
  document.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',b.dataset.g===pick.g))}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sp){pick.sp=b.dataset.sp;syncPick()}
  if(b.dataset.g){pick.g=b.dataset.g;syncPick()}
  if(b.dataset.a)act(b.dataset.a);
});
$('#rnd').onclick=()=>{pick.sp=Object.keys(SP)[Math.random()*3|0];pick.g=Math.random()<.5?'M':'F';$('#nm').value=NAMES[Math.random()*NAMES.length|0];syncPick()};
$('#go').onclick=()=>{P=newPet($('#nm').value.trim()||NAMES[Math.random()*NAMES.length|0],pick.sp,pick.g);startGame()};
$('#reset').onclick=()=>{if(confirm('เริ่มใหม่ทั้งหมด? สัตว์เลี้ยงตัวเดิมจะหายไป')){wipe();P=null;$('#game').classList.add('hide');$('#setup').classList.remove('hide')}};
function again(){wipe();P=null;rt.panel=null;$('#game').classList.add('hide');$('#setup').classList.remove('hide')}
function startGame(){$('#setup').classList.add('hide');$('#game').classList.remove('hide');buildBars();dailyBonus();renderPanel();update();save();if(!soc.ready&&socOn())socStart([])}

async function enter(){   // เรียกหลังล็อกอินแล้ว (หรือเล่นออฟไลน์เมื่อยังไม่ตั้งค่า Supabase)
  $('#auth').classList.add('hide');
  const s=await load();
  if(s){P=migrate(s);const acts=await socFetchInbox();socCatchUp(acts);   // คิดเวลาที่ปิดเกมไว้ (สูงสุด 8 ชม.) พร้อมใส่การช่วยดูแลของเพื่อนตามเวลาจริง
    P.last=Date.now();checkEvolve();startGame();socStart(acts)}
  else $('#setup').classList.remove('hide');
}
async function authGo(mode){
  const em=$('#em').value.trim(),pw=$('#pw').value,msg=$('#authMsg');
  if(!em||pw.length<6){msg.textContent='กรอกอีเมลและรหัสผ่าน (อย่างน้อย 6 ตัวอักษร)';return}
  msg.textContent='กำลังดำเนินการ…';
  const r=mode==='in'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
  if(r.error){msg.textContent='ไม่สำเร็จ: '+r.error.message;return}
  msg.textContent=(mode==='up'&&!r.data.session)?'สมัครแล้ว! กรุณายืนยันอีเมล แล้วกลับมาเข้าสู่ระบบ':'';
}
$('#liBtn').onclick=()=>authGo('in');
$('#suBtn').onclick=()=>authGo('up');
$('#logout').onclick=async()=>{clearTimeout(cloudT);await cloudSave();await sb.auth.signOut()};
(async()=>{
  buildSetup();$('#setup').classList.add('hide');
  requestAnimationFrame(frame);
  if(!sb){$('#logout').classList.add('hide');toast('ยังไม่ได้ตั้งค่า Supabase — เล่นแบบออฟไลน์');return enter()}
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;
  user?enter():$('#auth').classList.remove('hide');
  sb.auth.onAuthStateChange((ev,sess)=>{
    const u=sess?sess.user:null;
    if((u&&u.id)===(user&&user.id))return;
    user=u;socReset();
    if(u)enter();
    else{P=null;$('#game').classList.add('hide');$('#setup').classList.add('hide');$('#auth').classList.remove('hide')}
  });
})();
</script>
