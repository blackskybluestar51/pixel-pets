<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#130f1c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Pixel Pets – เลี้ยงสัตว์เลี้ยงแฟนตาซี</title>
<style>
:root{--bg:#fdf3fa;--card:#fff;--ink:#4a3b5c;--mut:#8b7a9e;--line:#eadcf2;--btn:#f3e4ff;--btnh:#e6ccff;--acc:#b78cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1726;--card:#2a2236;--ink:#f1e8fb;--mut:#a998bd;--line:#3b3050;--btn:#3a2d4f;--btnh:#4d3b69;--acc:#c9a6ff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;justify-content:center;padding:12px}
#app{width:100%;max-width:440px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
h1{font-size:20px;margin:4px 0 10px;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--btn);border:2px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;flex:1;min-width:0}
button:hover{background:var(--btnh)}button:disabled{opacity:.45;cursor:not-allowed}
button.on{border-color:var(--acc);background:var(--btnh)}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px}
canvas{image-rendering:pixelated}
input{font:inherit;width:100%;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
#scene{width:100%;border-radius:14px;border:2px solid var(--line);display:block}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.top b{font-size:18px}.mut{color:var(--mut);font-size:13px}
.bar{display:grid;grid-template-columns:76px 1fr 30px;gap:6px;align-items:center;font-size:13px;margin:4px 0}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .4s}
#say{text-align:center;font-size:14px;margin:8px 0 2px;min-height:20px}
#toast{z-index:60;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.item button{flex:0 0 auto;padding:4px 12px}
.qty{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 4px}.qty button{flex:0 0 auto;min-width:40px;padding:4px 10px;min-height:38px}.qty input{flex:0 0 auto;width:72px;min-height:38px;text-align:center;padding:4px 6px}
.mbtn{padding:12px 10px;font-weight:600}
.badge{display:inline-block;min-width:34px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;line-height:18px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,10,35,.55);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mbox{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;width:100%;max-width:420px;max-height:100%;overflow:auto;text-align:center}
.mbox h1{font-size:18px}
.row>input{flex:1 1 140px;width:auto;min-width:0}
.bf{margin:4px 0}.bfh{display:flex;justify-content:space-between;gap:6px;font-size:13px;flex-wrap:wrap;text-align:left}.chips{font-size:11px}
.bbar{position:relative;height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin-top:3px}
.bbar i{display:block;height:100%;background:#ff7a8a;transition:width .35s}.bbar.mp{height:10px}.bbar.mp i{background:#6aa8ff}
.bbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink);text-shadow:0 0 2px var(--card)}
.btlog{min-height:80px;background:var(--btn);border-radius:10px;padding:6px 8px;font-size:12.5px;text-align:left;margin:6px 0}
.btcmd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#btSub{text-align:left;margin-top:8px;max-height:36vh;overflow:auto}
.mbox>.row{position:sticky;bottom:-14px;background:var(--card);padding:8px 0 2px}
.elpg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.elc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));font-size:12px}
.elc:hover{background:color-mix(in srgb,var(--c) 26%,var(--card))}
.elc.sel{outline:3px solid var(--c);outline-offset:1px;background:color-mix(in srgb,var(--c) 34%,var(--card))}
.elE{font-size:26px;line-height:1}
.elgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.elgrid button{text-align:center;padding:8px 6px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0;text-align:center;font-size:13px}
.stats div{display:flex;flex-direction:column;background:var(--btn);border-radius:8px;padding:4px 0}
.hide{display:none!important}

/* ===================== UI v2 · โมเดิร์น · รองรับมือถือ/แท็บเล็ต/พีซี (ซ้อนทับสไตล์เดิม ไม่แตะตรรกะเกม) ===================== */
:root{--bg:#f4efff;--card:rgba(255,255,255,.84);--cs:#fff;--ink:#3d2f55;--mut:#7f6f96;--line:#e5daf4;--btn:#f1e8ff;--btnh:#e5d5ff;--acc:#8b6cff;--grad:linear-gradient(135deg,#a07bff 0%,#ff86c8 100%);--sh:0 10px 30px -14px rgba(96,60,170,.38);--r:20px;padding-top:0;padding-bottom:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130f1c;--card:rgba(42,34,60,.82);--cs:#2a2238;--ink:#f3ebff;--mut:#b3a3c9;--line:#40345a;--btn:#392d52;--btnh:#4b3b6c;--acc:#b794ff;--sh:0 10px 30px -14px rgba(0,0,0,.7)}}
*{-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html{-webkit-text-size-adjust:100%}
body{display:block;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));line-height:1.45;font-size:15px;background:radial-gradient(900px 500px at 8% -10%,color-mix(in srgb,#b79bff 38%,transparent),transparent 60%),radial-gradient(800px 480px at 105% 0%,color-mix(in srgb,#ff9ccf 30%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:520px;margin:0 auto}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line) 70%,#fff);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
h1{font-size:21px;font-weight:800;letter-spacing:.2px}
button{min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:14px;font-weight:600;touch-action:manipulation;transition:transform .12s,background .15s,box-shadow .15s,border-color .15s}
button:active:not(:disabled){transform:scale(.965)}
button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(139,108,255,.85)}
@media (hover:hover){button:hover:not(:disabled){background:var(--btnh);box-shadow:0 6px 16px -10px rgba(96,60,170,.6)}button.on:hover:not(:disabled){background:var(--grad);filter:brightness(1.06)}}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 65%,transparent);outline-offset:2px}
input{font-size:16px;min-height:46px;border-width:1.5px;border-radius:14px}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
label{font-weight:600;margin:12px 0 6px}
#auth,#setup{max-width:480px;margin:5vh auto 12px}
#spList{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.sp{border-radius:16px}
/* หัวการ์ด + ฉาก */
.top b{font-size:19px;font-weight:800}
#hCoin,#hTok{background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.hchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#scene{aspect-ratio:192/120;height:auto;object-fit:contain;border:0;border-radius:16px;margin-top:8px;box-shadow:inset 0 0 0 1px var(--line),0 8px 22px -14px rgba(60,30,120,.6)}
#say{font-size:14.5px;margin:10px 0 2px}
/* แถบสถานะ */
.bar{grid-template-columns:88px 1fr 36px;gap:8px;margin:7px 0}
.track{height:12px;border-radius:99px;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.fill{position:relative;border-radius:99px}
.fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.38),transparent 65%)}
/* ปุ่มคำสั่ง + เมนู */
#game>.card .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
#game>.card:nth-child(3) #actRow{margin-bottom:8px!important}
#menuCard .row{grid-template-columns:repeat(auto-fit,minmax(94px,1fr))}
.mbtn{min-height:62px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center;font-size:14px;border-radius:16px}
.badge{background:var(--grad);min-width:20px;text-align:center;box-shadow:0 2px 6px -2px rgba(139,108,255,.9)}
#game>.row:last-child{display:flex;justify-content:center;gap:8px}
#game>.row:last-child button{min-height:38px;font-size:13px;background:transparent}
.item{padding:10px 0;font-size:14.5px}.item button{min-height:38px;padding:5px 14px;border-radius:12px}
#panel{animation:rise .25s ease both}
.stats{gap:6px}.stats div{border-radius:12px;padding:7px 0;border:1px solid var(--line)}
.elc{border-radius:16px;padding:12px 8px}
/* หน้าต่างป๊อปอัป: มือถือ=bottom sheet · จอใหญ่=กล่องกลางจอ */
.modal{align-items:flex-end;padding:0;background:rgba(14,8,26,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s ease both}
.mbox{max-width:560px!important;max-height:92dvh;border:0;border-radius:26px 26px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--cs);box-shadow:0 -14px 50px -16px rgba(0,0,0,.5);overscroll-behavior:contain;animation:sheet .3s cubic-bezier(.2,.9,.3,1) both}
.mbox::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 10px}
.mbox>.row{bottom:calc(-16px - env(safe-area-inset-bottom,0px));padding:10px 0 4px}
#btModal .mbox canvas,#frModal .mbox canvas{border:0!important;border-radius:16px!important;aspect-ratio:auto;box-shadow:0 8px 22px -14px rgba(60,30,120,.6)}
.btcmd{gap:8px}.btcmd button{min-height:48px}
.btlog{border-radius:14px;padding:8px 10px;min-height:84px;max-height:22vh;overflow:auto}
.bbar{height:16px;border-radius:99px}.bbar.mp{height:11px}.bbar span{font-size:10.5px;font-weight:700}
.bbar i{background:linear-gradient(90deg,#ff6b81,#ff9a8a)}.bbar.mp i{background:linear-gradient(90deg,#5b9bff,#7fd0ff)}
#toast{background:color-mix(in srgb,var(--ink) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:10px 18px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
@keyframes fade{from{opacity:0}}@keyframes sheet{from{transform:translateY(40px);opacity:0}}@keyframes rise{from{transform:translateY(8px);opacity:0}}
@media (max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}.bar{grid-template-columns:76px 1fr 34px}}
/* แท็บเล็ต: เรียงการ์ดเป็นแนวตั้งคอลัมน์เดียวเหมือนมือถือ (จัดกึ่งกลาง) */
@media (min-width:700px){
 body{padding-top:max(18px,env(safe-area-inset-top))}
 #app{max-width:680px}
 .modal{align-items:center;padding:24px}
 .mbox{border-radius:26px;max-height:90dvh;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
 .mbox::before{display:none}.mbox>.row{bottom:-16px}
}
/* พีซี: 2 คอลัมน์ ฉาก (ซ้าย ติดหน้าจอ) + แผงควบคุม (ขวา) */
@media (min-width:1100px){
 body{font-size:16px}#app{max-width:1200px}
 #game:not(.hide){display:grid!important;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);gap:20px;align-items:start}
 #game>*{grid-column:2;margin:0}
 #game>.card:first-child{grid-column:1;grid-row:1/span 6;position:sticky;top:14px}
 #game>.row:last-child{grid-column:1/-1}
 #scene{max-height:calc(100dvh - 190px);width:100%}
 .card{padding:18px}
 #btModal .mbox{max-width:760px!important}#frModal .mbox{max-width:520px!important}
}
/* มือถือแนวนอน (จอเตี้ย): ต่อสู้ = ภาพซ้าย / คำสั่งขวา */
@media (orientation:landscape) and (max-height:540px){
 #btModal .mbox{display:grid;grid-template-columns:1.25fr 1fr;column-gap:14px;max-width:min(920px,96vw)!important;align-content:start;border-radius:22px}
 #btModal .mbox>*{grid-column:2}#btModal .mbox>canvas{grid-column:1;grid-row:1/span 7}
 .mbox::before{display:none}.btlog{max-height:16vh;min-height:56px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===================== Sheet popup: เมนูเกม / ให้อาหาร / เล่น บนมือถือ+แท็บเล็ต (<1100px) · พีซีคงแบบเดิม ===================== */
#pnlBack{position:fixed;inset:0;z-index:44;background:rgba(14,8,26,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s ease both}
#pnlBack.lite{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
html.pnl-open,html.pnl-open body{overflow:hidden}
#panel.sheet{position:fixed;z-index:45;left:0;right:0;top:auto;bottom:var(--kb,0px);margin:0 auto;width:100%;max-width:560px;max-height:min(70dvh,calc(100dvh - var(--kb,0px) - 12px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:0;border-radius:26px 26px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--cs);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 -14px 50px -16px rgba(0,0,0,.5);animation:sheet .3s cubic-bezier(.2,.9,.3,1) both}
#panel.sheet.lite{max-height:min(46dvh,calc(100dvh - var(--kb,0px) - 12px))}
.pnlHead{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;align-items:center;min-height:50px;margin:0 -16px 4px;padding:8px 12px 2px;background:var(--cs)}
.pnlHead::before{content:"";position:absolute;left:50%;top:8px;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:var(--line)}
.pnlX{flex:0 0 auto;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;font-size:16px;line-height:1;background:var(--btn)}
/* หน้าต่างหลัก (เมนูเกม / ต่อสู้ / เพื่อน / เลือกธาตุ) = กล่องกลางจอทุกขนาดหน้าจอ · ให้อาหาร/เล่น (.lite) ยังอยู่ด้านล่างเพื่อให้เห็นสัตว์เลี้ยง */
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
#panel.sheet:not(.lite){top:0;bottom:var(--kb,0px);margin:auto;height:fit-content;width:calc(100% - 24px);max-height:min(80dvh,calc(100dvh - var(--kb,0px) - 24px));padding-bottom:18px;border-radius:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.9,.3,1) both}
#panel.sheet:not(.lite) .pnlHead::before{display:none}
.modal{align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.mbox{max-height:min(88dvh,100%);padding:18px 16px 16px;border-radius:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.9,.3,1) both}
.mbox::before{display:none}.mbox>.row{bottom:-16px}

/* Shop quantity picker: centered modal for touch devices */
.shop-qty-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));background:rgba(18,10,30,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:shopQtyFade .16s ease-out}
.shop-qty-card{width:min(100%,420px);max-height:min(88dvh,680px);overflow:auto;overscroll-behavior:contain;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 22px 70px rgba(0,0,0,.32);text-align:center;animation:shopQtyPop .18s ease-out}
.shop-qty-head{display:flex;align-items:center;justify-content:center;position:relative;min-height:38px;padding:0 38px;font-size:18px}
.shop-qty-close{position:absolute;right:-5px;top:50%;transform:translateY(-50%);flex:0 0 38px;width:38px;min-width:38px;min-height:38px;padding:4px;border-radius:50%}
.shop-qty-card .qty{justify-content:center;gap:8px;margin:12px 0}
.shop-qty-card .qty span{flex-basis:100%;text-align:center}
.shop-qty-card .qty input{width:78px}
.shop-qty-total{font-size:18px;font-weight:800;margin:12px 0;padding:10px;border-radius:14px;background:var(--btn)}
.shop-qty-actions{margin-top:8px}
@keyframes shopQtyFade{from{opacity:0}to{opacity:1}}
@keyframes shopQtyPop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:380px){.shop-qty-card{padding:14px}.shop-qty-card .qty{gap:6px}.shop-qty-card .qty button{min-width:38px;padding:4px 8px}}

/* ===== 🚀 Space Shooter (มินิเกมในแอคชั่น เล่น) ===== */
.sshud{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;font-weight:700;margin:6px 2px 4px}
.sstrack{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.sstrack i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6ee7f9,#b78cff);transition:width .2s linear}
.modal#ssModal{padding:0;align-items:stretch;background:#0d0820}
#ssModal .mbox{max-width:none!important;width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;box-shadow:none;animation:none}
#ssModal .mbox::before{display:none}
.ssw{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;margin:8px 0 4px}
.ssc{position:relative;width:240px;height:360px}
#ssCv{display:block;width:100%;height:100%;border-radius:14px;border:2px solid var(--line);image-rendering:pixelated;touch-action:none;background:#0d0820;cursor:crosshair}
.sso{overflow:auto;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;background:rgba(13,8,32,.82);color:#fff;font-size:14px;line-height:1.45}
.sso .row{width:100%;margin-top:4px}.sso button{color:var(--ink)}
</style>
<style>
/* ===== ป๊อปอัปตีบวกสกิล: ค้อนตีทั่ง 3 วิ แล้วเฉลยผล ===== */

  if(state==='sleep')bob=[0,0,1,1][f]*0;

  /* ลักษณะเฉพาะสายพันธุ์ */
  if(sp==='slime'){R(c,x0+(w>>1)-1,y0-1,2,1,col);R(c,x0+1,y0+1,1,1,'#fff')}
  if(sp==='dragon'){
    R(c,x0+1,y0-1,1,2,D.h);R(c,x0+w-2,y0-1,1,2,D.h);
    R(c,x0+w,y0+h-3,2,1,col);R(c,x0+w+1,y0+h-4,1,1,sh);
    if(st>0){R(c,x0-1,y0+2,1,2,D.w);R(c,x0+w,y0+2,1,2,D.w)}
    R(c,x0+2,y0+h-3,w-4,2,state==='sick'?'#dcefc0':D.b);
  }
  if(sp==='unicorn'){
    R(c,(x0+(w>>1)),y0-2,1,2,D.h);R(c,x0,y0-1,1,1,sh);R(c,x0+w-1,y0-1,1,1,sh);
    R(c,x0-1,y0+1,1,Math.max(2,h-3),D.m);R(c,x0+w,y0+h-4,1,3,D.m);

  if(state==='sleep'||(state==='idle'&&f===3)||state==='eat'){R(c,ex1,ey+1,1,1,ink);R(c,ex2,ey+1,1,1,ink)}
  else if(state==='sick'){R(c,ex1,ey,1,2,ink);R(c,ex2,ey,1,2,ink);R(c,ex1,ey,1,1,col);R(c,ex2,ey,1,1,col)}
  else{R(c,ex1,ey,1,2,ink);R(c,ex2,ey,1,2,ink)}
  if(w>6){R(c,x0+1,ey+2,1,1,'#ff9eb5');R(c,x0+w-2,ey+2,1,1,'#ff9eb5')}
  const mx=x0+(w>>1)-1;
  if(state==='eat')R(c,mx,ey+3,2,f%2?1:2,mc);
  else if(state==='sick'){R(c,mx,ey+3,1,1,ink);R(c,mx+1,ey+(f%2?3:4),1,1,ink)}
  else if(state==='sleep')R(c,mx,ey+3,1,1,mc);
  else R(c,mx,ey+3,2,1,mc);
  if(acc){const lt=hexMix(acc,'#ffffff',.6);if(st>=1)R(c,x0+((w-1)>>1),y0+1,1,1,lt);                              // อัญมณีธาตุที่หน้าผาก (Young+)

      R(c,x0+2,y0-2,w-4,1,'#ffe27a');R(c,x0+2,y0-3,1,1,'#ffe27a');R(c,x0+w-3,y0-3,1,1,'#ffe27a');R(c,x0+(w>>1)-1,y0-3,2,1,'#ffe27a')}}   // มงกุฎ (Ascended)
  /* เอฟเฟกต์ประกอบ state */
  
  if(state==='sleep'){const z=f%2?[12,3]:[11,4];R(c,z[0],z[1],3,1,'#3b2f4a');R(c,z[0]+1,z[1]+1,1,1,'#3b2f4a');R(c,z[0],z[1]+2,3,1,'#3b2f4a')}

  const D=d.data,N=arguments[2]||80,W=arguments[3]||4*N;

  }
}

/* ---------- Animation Player: เล่นเฟรมตามลำดับ/ความเร็ว ---------- */
class AnimPlayer{
  constructor(){this.name='idle';this.t=0;this.f=0}
  play(n){if(n!==this.name){this.name=n;this.t=0;this.f=0}}
  update(dt){this.t+=dt;this.f=Math.floor(this.t*ANIM[this.name].fps)%FR}
  draw(ctx,sheet,x,y,scale,flip){
    ctx.save();ctx.imageSmoothingEnabled=false;
    if(flip){ctx.translate(x+CELL*scale,y);ctx.scale(-1,1);x=0;y=0}
    const box=CELL*scale,cs=sheet.cell||CELL,dsz=sheet.pix?cs*Math.max(1,Math.round(scale*sheet.pix)):box,dx=(box-dsz)/2,dy=box-dsz;   // ชีตที่เล็กกว่ากล่อง (เช่น เบบี้) วาดชิดล่างกึ่งกลาง
    const rw=ANIM[this.name].row,fr=sheet.fr?sheet.fr[rw]:FR;let ff=this.f,br=1;
    if(sheet.fr){const i=Math.floor(this.t*ANIM[this.name].fps*fr/FR*((sheet.spd&&sheet.spd[rw])||1)),lp=sheet.lp&&sheet.lp[rw];ff=(lp!=null&&i>=fr)?lp+(i-lp)%(fr-lp):i%fr;if(sheet.hold&&sheet.hold[rw]&&i>=fr)ff=fr-1}if(this.ffo!=null)ff=this.ffo;   // hold = เล่นครั้งเดียวแล้วค้างเฟรมสุดท้ายนิ่ง ๆ
   // lp = เฟรมเริ่มวนลูป (ท่านอนเล่นช่วงล้มตัวครั้งเดียวแล้ววนหายใจ)
    {const dh=dsz*br;ctx.drawImage(sheet,ff*cs,rw*cs,cs,cs,(flip?0:x)+dx,(flip?0:y)+dy+(dsz-dh),dsz,dh)}
    ctx.restore();
  }
}
/* ---------- Animation Controller: Game State → ชื่อ animation ---------- */
function chooseAnim(p,now){
  if(p.dead)return 'dead';
  if(p.healLeft>0)return p.healLeft/HEAL_SEC>.32?'sick':'idle';   // รักษา: ป่วยระหว่างโดนฉีดยา แล้วลุกขึ้นยืนปกติ               // ตายแล้ว
  if(now<rt.eatUntil)return 'eat';
  if(now<rt.playUntil&&rt.playItem==='ball'&&!isShadY(p))return 'walk';    // เล่นบอล → วิ่งเลี้ยงบอล       // ผู้เล่นกดให้อาหาร
  if(p.sleeping)return 'sleep';          // พลังงานหมด / สั่งนอน
  if(p.sick)return 'sick';
  if(isShadY(p)){const T=rt.tp;if(T&&now<T.t0+TP_T)return 'walk';if(now<rt.walkUntil&&!(T&&T.wu===rt.walkUntil)){shadTpStart(now);return 'walk'}}   // มังกรเงา: วาปแทนการเดิน
  else if(now<rt.walkUntil)return 'walk';
  if((isNatY(p)||isElecY(p))&&rt.walkUntil>0&&now<rt.walkUntil+SIT_MS)return 'sit';   // เดินจบ → ย่อตัวนั่ง (มังกรธรรมชาติ/ไฟฟ้าวัยรุ่น)
  return 'idle';                         // ไม่มีคำสั่ง
}

async function cloudSave(){
  if(!P||!user||!sb)return;
  if(cloudBusy){clearTimeout(cloudT);cloudT=setTimeout(cloudSave,700);return}
  cloudBusy=true;
  try{
    const ts=new Date().toISOString();
    if(!cloudStamp){   // ยังไม่มีเซฟบนคลาวด์ → สร้างใหม่ (ถ้ามีอยู่แล้ว แปลว่าอุปกรณ์อื่นสร้างไว้ → ใช้ของคลาวด์ ไม่เขียนทับ)
      const r=await sb.from('player_saves').insert({user_id:user.id,data:P,updated_at:ts}).select('updated_at');
      if(!r.error&&r.data&&r.data[0])cloudStamp=r.data[0].updated_at;
      else if(r.error&&String(r.error.code)==='23505')await cloudPull();
      else if(r.error)console.warn('cloud save:',r.error.message);
      return}
    // เขียนเฉพาะเมื่อเวอร์ชันบนคลาวด์ยังตรงกับที่เครื่องนี้รู้ (compare-and-swap) — ถ้าอุปกรณ์อื่นบันทึกไปก่อน จะดึงของเขามาแทนที่จะทับ
    const r=await sb.from('player_saves').update({data:P,updated_at:ts}).eq('user_id',user.id).eq('updated_at',cloudStamp).select('updated_at');
    if(r.error){console.warn('cloud save:',r.error.message);return}
    if(r.data&&r.data.length)cloudStamp=r.data[0].updated_at;
    else await cloudPull();
  }catch(e){console.warn('cloud save:',e&&e.message||e)}
  finally{cloudBusy=false}
}
async function cloudPull(){   // เทียบเวอร์ชันกับคลาวด์ ถ้าใหม่กว่าให้ใช้ของคลาวด์ (เรียกภายใน cloudSave หรือผ่าน cloudSync)
  const {data,error}=await sb.from('player_saves').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error){console.warn('cloud pull:',error.message);return false}
  if(!data){cloudStamp=null;return false}   // แถวหายไป (เช่นเริ่มใหม่จากอุปกรณ์อื่น) → รอบหน้าสร้างใหม่จากเซฟในเครื่อง
  if(cloudStamp&&new Date(data.updated_at).getTime()===new Date(cloudStamp).getTime())return false;
  cloudStamp=data.updated_at;
  if(!P)return false;
  P=migrate(data.data);P.last=Date.now();
  try{localStorage.setItem(lkey(),JSON.stringify(P))}catch(e){}
  update();renderPanel();toast('🔄 ซิงก์ข้อมูลล่าสุดจากอุปกรณ์อื่นแล้ว');return true}
async function cloudSync(){
  if(!sb||!user||!P)return;
  while(cloudBusy)await new Promise(r=>setTimeout(r,80));
  cloudBusy=true;try{await cloudPull()}catch(e){console.warn('cloud sync:',e&&e.message||e)}finally{cloudBusy=false}
}

  try{return JSON.parse(localStorage.getItem(lkey()))}catch(e){return null}
}

}

const QUESTS=[{k:'feed',n:'🍎 ให้อาหาร 3 ครั้ง',need:3,coin:15},{k:'bath',n:'🛁 อาบน้ำ 1 ครั้ง',need:1,coin:10},{k:'play',n:'⚽ เล่นด้วย 3 ครั้ง',need:3,coin:15},{k:'fight',n:'⚔️ ชนะการต่อสู้ 1 ครั้ง',need:1,coin:20},{k:'win3',n:'🏆 ชนะต่อสู้ 3 ครั้ง',need:3,coin:20,stone:1}];
function qState(){if(!P.q||P.q.day!==dayKey())P.q={day:dayKey(),feed:0,bath:0,play:0,fight:0,done:{}};return P.q}
function qAdd(k){const q=qState(),d=QUESTS.find(x=>x.k===k);q[k]=(q[k]||0)+1;
  if(q[k]>=d.need&&!q.done[k]){q.done[k]=1;P.coins+=d.coin;if(d.stone)P.inv.skstone=(P.inv.skstone||0)+d.stone;addXp(10);toast('📋 ภารกิจสำเร็จ! +'+d.coin+' 🪙'+(d.stone?' +'+d.stone+' 💠':''))}}
function dailyBonus(){
  if(!P||P.dead)return;const d=dayKey();if(P.lastDay===d)return;
  P.streak=(P.lastDay===dayKey(-864e5))?(P.streak||0)+1:1;P.lastDay=d;
  const c=10+Math.min(P.streak,7)*3;P.coins+=c;toast('🎁 โบนัสเข้าเกมวันนี้ +'+c+' 🪙 (ต่อเนื่อง '+P.streak+' วัน)');
}
const BATH_RATE=2,BATH_HAP=0.05,HEAL_SEC=8,SLEEP_EN=40;   // อาบน้ำ: ความสะอาดเพิ่ม BATH_RATE ต่อวินาที (เร็วขึ้น 2 เท่า) หยุดเองเมื่อครบ 100 · นอน: พลังงานเพิ่ม SLEEP_EN ต่อนาที (เร็วขึ้น 2 เท่า จากเดิม 20)
function step(p,sec,safe){
  if(p.dead)return;
  const m=sec/60,s=p.sleeping;
  if(p.healLeft>0){p.healLeft-=sec;p.bathing=false;if(p.healLeft<=0){p.healLeft=0;p.sick=false;p.hp=clamp(p.hp+30);hs('heal');addXp(5);addBond(2);toast('💊 หายป่วยแล้ว!')}}
  if(p.bathing){if(p.sleeping)p.bathing=false;else{const b=Math.min(sec,Math.max(0,100-p.clean)/BATH_RATE);p.clean+=BATH_RATE*b;p.hap-=BATH_HAP*b;
    if(p.clean>=99.99){p.clean=100;p.bathing=false;hs('bath');addXp(3);addBond(1);toast('✨ อาบน้ำเสร็จแล้ว ตัวสะอาด 100')}}}
  const tf=hasT(p,'lowfood')?.75:1,tp=hasT(p,'playful')?.75:1,tt=hasT(p,'tidy')?.75:1;   // ลักษณะพิเศษ
  p.food-=(s?1.5:3)*m*tf;p.hap-=(s?.5:2)*m*tp;p.clean-=(s?.5:2)*m*tt;p.en+=s?SLEEP_EN*m*(hasT(p,'fastrest')?1.4:1):-1.5*m;
  if(p.sick){p.hp-=2*m;p.hap-=2*m}
  else if((p.clean<25||p.hp<35)&&Math.random()<Math.min(1,.15*m*(hasT(p,'hardy')?.6:1)))p.sick=true;
  const bad=p.food<15||p.clean<15||p.en<8;
  if(bad)p.hp-=3*m; else if(!p.sick&&p.food>50&&p.clean>50&&p.hap>50&&p.en>30)p.hp+=2*m;
  if(p.en<=0)p.sleeping=true; if(p.sleeping&&p.en>=100)p.sleeping=false;
  ['food','hap','clean','en'].forEach(k=>p[k]=clamp(p[k]));if(p.stage===0)p.minClean=Math.min(p.minClean==null?100:p.minClean,p.clean);
  p.hp=clamp(p.hp,safe?5:0,100);if(p.hp<=0)die(p,'สุขภาพทรุดโทรม');                       // ตายเมื่อสุขภาพเป็น 0 (ช่วงปิดเกมไว้จะไม่ตายจากสุขภาพ)
  if(!p.sick&&p.food>=60&&p.hap>=60&&p.clean>=60&&p.en>=60&&p.hp>=60){   // ดูแลดี ทุกค่า ≥ 60 → 1 เหรียญ/นาที
    p.cf=(p.cf||0)+m*(hasT(p,'lucky')?1.2:1);const w=Math.floor(p.cf);if(w>0){p.coins+=w;p.cf-=w}}
  p.bond=clamp((p.bond||0)+((!p.sick&&p.food>=60&&p.hap>=60&&p.clean>=60&&p.en>=60&&p.hp>=60)?.3:(p.hap<30||p.food<20?-.4:0))*m);   // ความผูกพัน
  p.careSum+=(p.food+p.hap+p.clean+p.en+p.hp)/5*sec;p.careN+=sec;p.lifeSum=(p.lifeSum||0)+(p.food+p.hap+p.clean+p.en+p.hp)/5*sec;p.lifeN=(p.lifeN||0)+sec;
}
function die(p,why){p.dead=true;p.cause=why;p.diedAt=Date.now();p.sleeping=false;p.sick=false;rt.panel=null;toast('🪦 '+p.name+' จากไปแล้ว ('+why+')');renderPanel();save()}
function lifespanDays(p){return 2700}   // อายุขัย 2700 วัน (1 วัน = 5 นาที ≈ 9.4 วันจริง) — เลื่อนเลเวลต้องใช้เวลานาน
function stageFor(p){return p.lv<10?0:1}   // Lv.10 → Young อัตโนมัติ · Adult (Lv.25) และ Ascended (Lv.40) ต้องกดปุ่มวิวัฒนาการ ใช้ 💎 + ค่าดูแลเต็ม 100

/* ===== โหมดนักพัฒนา: ปุ่มวิวัฒนาการทันที (เปิดด้วย ?dev=1 หรือ Ctrl+Shift+D) ===== */
function devEvolve(){
  if(!P||P.dead)return toast('🛠️ ไม่มีสัตว์เลี้ยงที่มีชีวิต');
  if(P.stage>=3)return toast('🛠️ อยู่ขั้นสูงสุดแล้ว');
  const lvNeed=[10,25,ASC.lv][P.stage];if(P.lv<lvNeed){P.lv=lvNeed;P.xp=0}
  const pickEl=(document.getElementById('devEl')||{}).value;   // เลือกธาตุจากแถบ DEV (ว่าง = อัตโนมัติ)
  if(pickEl&&EL[pickEl]){P.el=pickEl;P.role=pickRole(P,pickEl)}
  else if(P.stage===0){const u=unlockPick(P),el=(u&&u.el)||P.el||'fire';P.el=el;P.role=pickRole(P,el)}
  P.stage++;P.careSum=P.careN=0;
  if(P.stage===2)P.sub=pickSub(P);
  toast('🛠️ [DEV] '+P.name+' → '+STAGES[P.stage]);
  if(P.stage===1)setTimeout(openUnlockModal,600);
  renderPanel();update();save()}
function devBar(on){
  let b=document.getElementById('devBar');
  if(!on){if(b)b.remove();return}
  if(b)return;
  b=document.createElement('div');b.id='devBar';
  b.style.cssText='position:fixed;left:8px;bottom:8px;z-index:9999;background:#222d;color:#fff;padding:6px 8px;border-radius:10px;font:12px sans-serif;display:flex;gap:6px;align-items:center';
  b.style.flexWrap='wrap';b.style.maxWidth='calc(100vw - 16px)';
  b.innerHTML='🛠️ DEV <select id="devEl" style="font-size:12px;padding:3px 4px;border-radius:6px"><option value="">ธาตุ: อัตโนมัติ</option>'+Object.keys(EL).map(k=>'<option value="'+k+'">'+EL[k].e+' '+EL[k].n+'</option>').join('')+'</select><button id="devEvo" style="font-size:12px;padding:3px 8px">⏩ วิวัฒนาการทันที</button>';
  document.body.appendChild(b);
  b.querySelector('#devEvo').onclick=()=>devEvolve()}
(function(){let on=false;try{if(/[?&]dev=1/.test(location.search))localStorage.setItem('pp_dev','1');if(/[?&]dev=0/.test(location.search))localStorage.removeItem('pp_dev');on=localStorage.getItem('pp_dev')==='1'}catch(e){on=/[?&]dev=1/.test(location.search)}
  const set=v=>{on=v;try{v?localStorage.setItem('pp_dev','1'):localStorage.removeItem('pp_dev')}catch(e){}devBar(v)};
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='D'||e.key==='d')){e.preventDefault();set(!on)}});
  window.devMode=set;window.devEvolve=devEvolve;if(on)(document.body?devBar(true):addEventListener('DOMContentLoaded',()=>devBar(true)))})();
function checkEvolve(){
  if(P.dead)return;
  if((Date.now()-P.born)/DAY_MS>=lifespanDays(P)){die(P,'ชราภาพ');return}
  const s=stageFor(P);
  if(s>P.stage&&P.stage===0&&!unlockPick(P)){if(!P.warned){P.warned=1;toast('🧬 ถึง Lv.10 แล้ว แต่ยังไม่ตรงเงื่อนไขปลดล็อกธาตุ — ดูในเมนู "ข้อมูล"')}}
  else if(s>P.stage&&P.stage<2){
    if(P.stage===0){const u=unlockPick(P);P.el=u.el;P.role=pickRole(P,u.el)}P.stage++;P.careSum=P.careN=0;if(P.stage===1)setTimeout(openUnlockModal,600);if(P.stage===2)P.sub=pickSub(P);
    {const r=P.stage===1?30:60;P.coins+=r;addXp(20);toast('✨ '+P.name+' วิวัฒนาการเป็น '+STAGES[P.stage]+' +'+r+' 🪙')}
  }
}

/* ---------- การกระทำ ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function act(a){
  if(P.dead)return toast('จากไปแล้ว… เริ่มเลี้ยงตัวใหม่ได้ด้านล่าง');
  if(P.bathing&&['feed','play','sleep','heal'].includes(a))return toast('🛁 กำลังอาบน้ำอยู่… รอให้เสร็จหรือกดหยุดอาบก่อน');
  if(a==='feed'||a==='play'||a==='shop'||a==='quest'||a==='info'||a==='battle'||a==='friends'||a==='forge'||a==='autocare'){rt.panel=rt.panel===a?null:a;(a==='shop'||a==='quest'||a==='info'||a==='battle'||a==='friends'||a==='forge'||a==='autocare'?$('#menuCard'):$('#actRow').closest('.card')).after($('#panel'));if(a==='friends'&&rt.panel==='friends')socRefresh();if((a==='battle'||a==='shop')&&rt.panel===a)tokPull();return renderPanel()}
  rt.panel=null;
  if(a==='bath'){if(P.bathing){P.bathing=false;toast('หยุดอาบน้ำแล้ว')}else{if(P.sleeping)return toast('กำลังหลับอยู่…');if(P.clean>=99)return toast('ตัวสะอาดอยู่แล้ว');P.bathing=true;toast('🛁 เริ่มอาบน้ำ… จะหยุดเองเมื่อสะอาด 100');qAdd('bath')}}
  if(a==='sleep'){if(P.sleeping){if(P.en<30)return toast('ยังเหนื่อยอยู่ ให้นอนต่อก่อน');P.sleeping=false}else P.sleeping=true}
  if(a==='heal'){
    if(P.healLeft>0)return toast('กำลังรักษาอยู่…');if(!P.sick)return toast('ไม่ได้ป่วย 😊');
    if(!P.inv.med)return toast('ไม่มียา — ซื้อได้ที่ร้านค้า');
    P.inv.med--;P.healLeft=HEAL_SEC;P.bathing=false;rt.x=56;toast('🏥 เริ่มรักษา… ใช้เวลา '+HEAL_SEC+' วินาที')}
  renderPanel();update();save();
}
function feed(k){const f=FOODS[k];if(!P.inv[k])return;if(P.bathing)return toast('กำลังอาบน้ำอยู่…');if(P.sleeping)return toast('กำลังหลับอยู่…');
  P.inv[k]--;hs('feed');hfav('foods',k);P.food=clamp(P.food+f.food);P.hap=clamp(P.hap+f.hap);if(f.hp)P.hp=clamp(P.hp+f.hp,1,100);rt.eatUntil=Date.now()+EAT_MS;rt.eatItem=k;rt.panel=null;qAdd('feed');addXp(3);addBond(1);renderPanel();update();save()}
function play(k){
  if(P.bathing)return toast('กำลังอาบน้ำอยู่…');
  if(P.sleeping)return toast('กำลังหลับอยู่…');if(P.en<15)return toast('เหนื่อยเกินไป ให้นอนก่อน');
  let hap=12,en=10;if(k){if(!P.inv[k])return;P.inv[k]--;hap=TOYS[k].hap;en=TOYS[k].en}   // เล่นไม่ให้ EXP/เหรียญ (กันปั๊ม) · ได้แค่ความสุข/สายสัมพันธ์/ความคืบหน้าภารกิจ
  P.hap=clamp(P.hap+hap);P.en=clamp(P.en-en);hs('play');hfav('toys',k||'hand');{const d=k==='ball'?4000:2500;rt.playItem=k||null;rt.playDur=d;rt.playUntil=Date.now()+d}rt.walkUntil=Date.now()+2500;rt.dir=Math.random()<.5?-1:1;
  toast('🎉 สนุก!');qAdd('play');addBond(2);rt.panel=null;renderPanel();update();save()}
/* ---------- 🤝 ร้านค้าพันธมิตร: ใช้แต้มมิตรภาพซื้อ ----------
   แต้มมิตรภาพเก็บที่เซิร์ฟเวอร์ (profiles.friend_points) → หักแต้มที่เซิร์ฟเวอร์เท่านั้น (friend_shop_buy) กันโกง
   ราคา/รายการต้องตรงกับในไฟล์ supabase-friend-shop.sql (เซิร์ฟเวอร์ใช้ราคาของตัวเองเป็นหลัก) */
const PARTNER=[
  {k:'med',n:MED.n,price:6,d:'รักษาอาการป่วย · ใช้ในต่อสู้ได้'},
  {k:'skstone',n:SKS.stone.n,price:25,d:'ใช้ตีบวกสกิล'},
  {k:'crystal',n:SPECIAL.crystal.n,price:120,d:'ของหายาก · วิวัฒนาการ'},
  {k:'token',n:'⚔️ Token ต่อสู้',price:10,d:'ฟื้น Token ต่อสู้ 1 อัน'}];
const fpBal=()=>Math.max(0,((soc.me&&soc.me.points)||0)-(soc.spent||0));   // แต้มที่ใช้ได้ = แต้มที่ได้รับทั้งหมด − แต้มที่ใช้ไปแล้ว
async function fpPull(){if(!socOn())return;const r=await socCall('friend_points_status');
  if(r&&r.ok){soc.spent=r.spent||0;if(soc.me&&typeof r.earned==='number')soc.me.points=r.earned;if(rt.panel==='shop'||rt.panel==='friends')renderPanel()}}
function setShopTab(t){wkPull();rt.shopTab=t;rt.shopSelected=null;rt.shopQty=1;if(t==='partner')fpPull();renderPanel()}
let fpBusy=false;
async function buyPartner(k){const it=PARTNER.find(x=>x.k===k);if(!it)return;const q=sq();
  if(k==='token')return buyTok('friend');
  if(!socOn())return toast('ต้องล็อกอินระบบเพื่อนก่อน');
  if(fpBusy)return;if(!wkCheck(k,q))return;if(fpBal()<it.price*q)return toast('แต้มมิตรภาพไม่พอ (ต้องใช้ '+it.price*q+' 💞)');
  fpBusy=true;
  try{const r=await socCall('friend_shop_buy',q>1?{p_item:k,p_qty:q}:{p_item:k});
    if(r&&typeof r.spent==='number'){soc.spent=r.spent;if(soc.me&&typeof r.earned==='number')soc.me.points=r.earned}
    if(r&&r.ok){wkAdd(k,q);if(k==='crystal'&&typeof r.crystals==='number')P.inv.crystal=r.crystals;else P.inv[k]=(P.inv[k]||0)+q;toast('✅ ซื้อ '+it.n+(q>1?' ×'+q:'')+' สำเร็จ (−'+(r.total||it.price*q)+' 💞)');clearShopSelection();update();save()}
    else{const m=(r&&r.msg)||'';toast(/friend_shop_buy|function|schema cache/i.test(m)?'ร้านพันธมิตรยังใช้ไม่ได้: ต้องรัน supabase-friend-shop.sql ใน Supabase ก่อน':(m||'⚠️ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'));renderPanel()}}
  finally{fpBusy=false}}

/* ---------- ⚔️ ซื้อ Token: ร้านปกติ 10 🪙 · ร้านพันธมิตร 10 💞 · วันละ 50 อันต่อร้าน ---------- */
const tokLeft=src=>socOn()?(rt.tokLeft?rt.tokLeft[src]:null):Math.max(0,TOKB.daily-((P.tokBuy&&P.tokBuy.day===dayKey())?P.tokBuy.n:0));
let tokBuyBusy=false;
async function buyTok(src){
  if(tokBuyBusy)return;
  const q=sq(),tot=TOKB.price*q;
  if(src==='coin'&&P.coins<tot)return toast('เหรียญไม่พอ (ต้องใช้ '+tot+' 🪙)');
  if(src==='friend'){if(!socOn())return toast('ต้องล็อกอินระบบเพื่อนก่อน');if(fpBal()<tot)return toast('แต้มมิตรภาพไม่พอ (ต้องใช้ '+tot+' 💞)')}
  {const lf=tokLeft(src);if(lf===0)return toast('วันนี้ซื้อ Token ครบ '+TOKB.daily+' อันแล้ว');if(lf!=null&&q>lf)return toast('วันนี้ซื้อ Token ได้อีก '+lf+' อัน')}
  if(!socOn()){   // ออฟไลน์: นับและหักในเครื่อง
    if(!P.tokBuy||P.tokBuy.day!==dayKey())P.tokBuy={day:dayKey(),n:0};
    P.coins-=tot;P.tokBuy.n+=q;{const c=tokSync();tokSet((c>=TOK_MAX?c:Math.floor(c))+q)}toast('✅ ซื้อ ⚔️ Token'+(q>1?' ×'+q:'')+' สำเร็จ (−'+tot+' 🪙)');clearShopSelection();update();save();return}
  tokBuyBusy=true;if(src==='coin'){P.coins-=tot;update()}
  try{const r=await socCall('battle_token_buy',q>1?{p_src:src,p_qty:q}:{p_src:src});
    if(r&&typeof r.tokens==='number')tokSet(r.tokens);
    if(r&&r.buy_left)rt.tokLeft=r.buy_left;
    if(r&&typeof r.spent==='number'){soc.spent=r.spent;if(soc.me&&typeof r.earned==='number')soc.me.points=r.earned}
    if(r&&r.ok){toast('✅ ซื้อ ⚔️ Token'+(q>1?' ×'+q:'')+' สำเร็จ (−'+tot+(src==='coin'?' 🪙':' 💞')+')');rt.shopSelected=null;rt.shopQty=1;save()}
    else{if(src==='coin')P.coins+=tot;const m=(r&&r.msg)||'';toast(/battle_token_buy|function|schema cache/i.test(m)?'ซื้อ Token ยังไม่ได้: ต้องรัน supabase_v15.sql ใน Supabase ก่อน':(m||'⚠️ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'))}
    renderPanel();update()}
  finally{tokBuyBusy=false}}
/* ---------- 🔢 ซื้อแบบระบุจำนวน (ใช้กับทุกรายการในร้านค้าปกติ/พันธมิตร) ---------- */
const QTY_MAX=100;   // ต่อครั้ง · ต้องตรงกับ p_qty (1–100) ในเซิร์ฟเวอร์
const sq=()=>Math.max(1,Math.min(QTY_MAX,Math.floor(+rt.shopQty)||1));
function setQty(v){
  rt.shopQty=Math.max(1,Math.min(QTY_MAX,Math.floor(+v)||1));
  const q=sq(),input=document.getElementById('qtyIn');
  if(input&&input.value!==String(q))input.value=q;
  const mx=maxQty();document.querySelectorAll('.qty button[data-q]').forEach(b=>b.classList.toggle('on',b.dataset.q==='all'?q===mx:+b.dataset.q===q));
  const totalEl=document.querySelector('.shop-qty-total');
  const sel=rt.shopSelected;
  if(totalEl&&sel){
    const [kind,key]=sel.id.split('|');
    const partner=kind==='partner';
    const item=partner?PARTNER.find(x=>x.k===key):kind==='f'?FOODS[key]:kind==='t'?TOYS[key]:kind==='m'?MED:kind==='s'?SPECIAL[key]:kind==='stone'?SKS.stone:kind==='tokencoin'?{price:TOKB.price}:null;
    if(item){
      const unit=partner?'💞':'🪙',total=item.price*q;
      totalEl.textContent='รวมทั้งหมด: '+total.toLocaleString('en-US')+' '+unit;
      const balance=partner?fpBal():P.coins;
      const dailyLeft=shopLeft(kind,key);
      const disabled=balance<total||(dailyLeft!=null&&(dailyLeft===0||q>dailyLeft))||(partner&&!soc.ready);
      const confirm=document.querySelector('.shop-qty-actions .on');
      if(confirm)confirm.disabled=disabled;
    }
  }
}
function shopCtx(){
  const sel=rt.shopSelected;if(!sel)return null;

function autoUpPopup(o){
  const sparks=[[-34,-34],[-12,-46],[16,-42],[38,-26],[-46,-10],[44,-6]].map((d,i)=>`<circle class="spk" cx="101" cy="72" r="${i%2?2.4:3.2}" fill="${i%2?'#fff3b0':'#7fe3a0'}" style="--dx:${d[0]}px;--dy:${d[1]}px"/>`).join('');

  const ov=document.createElement('div');ov.className='modal fgm';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  ov.innerHTML=`<div class="mbox fgbox"><div id="fgBody">
    <h1>🧑🏻‍🍼 กำลังอัปเกรดผู้ดูแล<span class="fgdots"></span></h1>
    <div class="fgsub">ระดับ ${o.from} → ระดับ ${o.to} · ${o.cost} G</div>

      <ellipse cx="100" cy="130" rx="62" ry="6" fill="rgba(0,0,0,.18)"/>
      <text class="gem" x="100" y="96" text-anchor="middle" font-size="46">🧑🏻‍🍼</text>
      ${arrows}${sparks}
    </svg>
    <div class="fgprog"><i id="fgBar"></i><b id="fgPct">0%</b></div>
    <div class="fgsub" style="margin:8px 0 0">ลุ้นให้ดี… โอกาสสำเร็จ ${o.rate}%</div>
  </div></div>`;
  document.body.appendChild(ov);try{forgeSfx.start()}catch(e){}
  const box=ov.firstElementChild,body=ov.querySelector('#fgBody'),bar=ov.querySelector('#fgBar'),pct=ov.querySelector('#fgPct'),t0=performance.now();
  let done=false,alive=true;
  (function tick(now){if(!alive||!bar.isConnected||done)return;
    const p=Math.min(1,((now||performance.now())-t0)/3000);bar.style.width=(p*100)+'%';pct.textContent=Math.floor(p*100)+'%';
    if(p<1)requestAnimationFrame(tick)})(t0);
  return{
    cancel(){alive=false;done=true;ov.remove()},
    reveal(r){return new Promise(resolve=>{
      const close=()=>{if(!done)return;document.removeEventListener('keydown',escKey,true);ov.remove();resolve()};
      const escKey=e=>{if(e.key==='Escape'&&done){e.stopPropagation();close()}};
      setTimeout(()=>{
        if(!alive)return resolve();
        done=true;try{r.ok?forgeSfx.win():forgeSfx.lose()}catch(e){}
        const stars=r.ok?Array.from({length:12},(_,i)=>{const a=i/12*Math.PI*2,d=90+Math.random()*50;return `<span class="fgstar" style="left:50%;top:46%;--dx:${Math.cos(a)*d|0}px;--dy:${Math.sin(a)*d|0}px;animation-delay:${(Math.random()*.2).toFixed(2)}s">${i%3?'✨':'⭐'}</span>`}).join(''):'';
        body.innerHTML=r.ok
          ?`<div class="fgres ok" aria-live="assertive"><div class="fgico">🧑🏻‍🍼✨</div><h2>สำเร็จ!</h2><div class="fgnm">ผู้ดูแลระดับ ${o.to}</div><div class="fgmsg">ดูแลได้ ${AUTO_LEVELS[o.to]} ประเภทแล้ว! (−${o.cost} G)</div><button class="on" id="fgOk" type="button">เยี่ยม!</button></div>${stars}`
          :`<div class="fgres no" aria-live="assertive"><div class="fgico">💥</div><h2>ล้มเหลว</h2><div class="fgnm">ผู้ดูแลยังคงระดับ ${o.from}</div><div class="fgmsg">เสียเหรียญ ${o.cost} G · ลองใหม่ได้<br>โอกาสสำเร็จ ${o.rate}% ทุกครั้ง</div><button class="on" id="fgOk" type="button">ปิด</button></div>`;
        box.insertAdjacentHTML('afterbegin','<div class="fgflash"></div>');
        if(!r.ok)box.classList.add('shake');
        document.addEventListener('keydown',escKey,true);
        ov.addEventListener('click',e=>{if(e.target===ov)close()});
        const b=ov.querySelector('#fgOk');b.addEventListener('click',close);b.focus();
        if(navigator.vibrate){try{navigator.vibrate(r.ok?[60,40,60]:200)}catch(e){}}
      },Math.max(0,3000-(performance.now()-t0)));
    })}};
}

/* ---------- อนิเมชันเล่น: ลูกบอล (เลี้ยงไปมา) ---------- */
function drawBall(ctx,x,y,r,ang){   // ลูกฟุตบอลลายขาว-ดำ
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
  ctx.fillStyle='#fff';ctx.fillRect(-r,-r,2*r,2*r);
  const pent=(cx,cy,pr,rot)=>{ctx.beginPath();for(let i=0;i<5;i++){const a=rot+i*Math.PI*2/5;ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*pr,cy+Math.sin(a)*pr)}ctx.closePath();ctx.fill()};
  ctx.strokeStyle='#9a96a8';ctx.lineWidth=1;
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.38,Math.sin(a)*r*.38);ctx.lineTo(Math.cos(a)*r*.72,Math.sin(a)*r*.72);ctx.stroke()}
  ctx.fillStyle='#2b2535';pent(0,0,r*.4,-Math.PI/2);
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;pent(Math.cos(a)*r,Math.sin(a)*r,r*.42,a+Math.PI)}
  ctx.restore();
  ctx.strokeStyle='#2b2535';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}
function drawPlay(ctx,now){
  const k=rt.playItem;if(!k||now>=rt.playUntil)return;
  const t=Math.max(0,Math.min(1,1-(rt.playUntil-now)/rt.playDur)),cx=rt.x+40;

/* ---------- อนิเมชันรักษา: เข็มฉีดยาลอยลงมา ฉีดที่ตัวละคร (ใช้ได้กับทุกสายพันธุ์/ทุกวัย) ----------
   ไทม์ไลน์ (วินาทีจากเริ่มรักษา · HEAL_SEC=8): 0–1.5 ลอยลงมา · 1.5–1.9 จิ้ม (ตัวสะดุ้ง) · 1.9–5.4 ดันลูกสูบ ยาไหลเข้าตัว มีวงคลื่น+เครื่องหมายบวก · 5.4–6.4 ดึงเข็มออกลอยขึ้นจางหาย · 6.4–8 ประกายหายป่วย + 💖
   จุดฉีดคำนวณจากกรอบตัวจริงของสไปรต์ (เฟรม idle) → ตรงกับตัวละครทุกแบบ */
const HEAL_T={dn:1.5,jab:1.9,inj:5.4,out:6.4};
function healE(now){if(!rt.healAt)rt.healAt=now-(HEAL_SEC-P.healLeft)*1000;return Math.max(0,(now-rt.healAt)/1000)}
function healShake(now){if(!(P.healLeft>0)||!rt.healAt)return 0;const e=healE(now);return e>=HEAL_T.dn&&e<HEAL_T.dn+.35?Math.round(Math.sin((e-HEAL_T.dn)*55)*1.5):0}   // สะดุ้งตอนโดนเข็ม
function healBox(){   // กรอบตัวละครบนฉาก (พิกัดแคนวาส) จากเฟรม idle
  const sh=getSheet(P.sp,P.stage,1,accOf(P)),cs=sh.cell||16,nf=sh.fr?sh.fr[0]:4;
  if(!sh.__bb){const t=document.createElement('canvas');t.width=cs;t.height=cs;const tc=t.getContext('2d');let x0=1e9,y0=1e9,x1=-1,y1=-1;
    for(let f=0;f<nf;f++){tc.clearRect(0,0,cs,cs);tc.drawImage(sh,f*cs,0,cs,cs,0,0,cs,cs);const d=tc.getImageData(0,0,cs,cs).data;
      for(let y=0;y<cs;y++)for(let x=0;x<cs;x++)if(d[(y*cs+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
    sh.__bb=[x0,y0,x1+1,y1+1]}
  const b=sh.__bb,dsz=sh.pix?cs*Math.max(1,Math.round(5*sh.pix)):80,k=dsz/cs,x0=rt.x+(80-dsz)/2,y0=26+80-dsz;
  return{l:x0+b[0]*k,t:y0+b[1]*k,r:x0+b[2]*k,b:y0+b[3]*k}}
function drawSyringe(c,L){   // ปลายเข็มอยู่ที่ (0,0) ตัวกระบอกชี้ขึ้น (-y) · L = ระดับยาในกระบอก 0–1
  c.fillStyle='#dfe6f2';c.beginPath();c.moveTo(0,0);c.lineTo(-1,-9);c.lineTo(1,-9);c.closePath();c.fill();          // เข็ม
  c.fillStyle='#a9a3bb';c.fillRect(-2.5,-12,5,3);                                                                  // หัวเข็ม
  c.fillStyle='rgba(240,250,255,.94)';c.fillRect(-4.5,-32,9,20);c.strokeStyle='#8f89a3';c.lineWidth=1;c.strokeRect(-4.5,-32,9,20);   // กระบอก
  const h=18*L,top=-13-h;c.fillStyle='#6fd3ff';c.fillRect(-3.5,top,7,h);                                           // ยา
  c.strokeStyle='#8f89a3';for(let i=1;i<=4;i++){c.beginPath();c.moveTo(1.5,-13-i*4);c.lineTo(4.5,-13-i*4);c.stroke()}   // ขีดบอกปริมาณ
  c.fillStyle='#8f89a3';c.fillRect(-7,-34,14,2);                                                                   // ปีกจับ
  c.fillStyle='#ff6b81';c.fillRect(-3.5,top-2,7,2);                                                                // หัวลูกสูบ
  c.fillStyle='#c9c4d6';c.fillRect(-.8,top-16,1.6,14);c.fillStyle='#ff8fab';c.fillRect(-5,top-19,10,3)}            // ก้านลูกสูบ + ที่กดนิ้วโป้ง
function drawHealSyringe(ctx,now){
  const e=healE(now),T=HEAL_T,B=healBox(),tx=(B.l+B.r)/2+(B.r-B.l)*.1,ty=B.t+(B.b-B.t)*.38;   // จุดฉีด: ลำตัวช่วงบน
  const q=x=>Math.max(0,Math.min(1,x)),ez=x=>1-Math.pow(1-q(x),3),th=-.32,dx=-Math.sin(th),dy=Math.cos(th);   // ทิศเข็ม (ชี้ลงขวา)
  if(e<T.out){
    let sd,al=1,ang=th,sw=0;
    if(e<T.dn){const p=ez(e/T.dn);sd=7+95*(1-p);sw=(1-p)*5*Math.sin(e*7);ang=th+(1-p)*.14*Math.sin(e*6)}   // ลอยลงมาแกว่งเบาๆ
    else if(e<T.jab)sd=7-9*ez((e-T.dn)/(T.jab-T.dn));                                                       // จิ้มเข้าตัว
    else if(e<T.inj)sd=-2;                                                                                   // ค้างฉีดยา
    else{const u=(e-T.inj)/(T.out-T.inj);sd=-2+42*ez(u);al=1-q((u-.3)/.7)}                                  // ดึงออก ลอยขึ้น จาง
    const L=e<T.jab?1:e<T.inj?1-.92*ez((e-T.jab)/(T.inj-T.jab)):.08;
    ctx.save();
    if(e>=T.jab&&e<T.inj+.5){const g=ctx.createRadialGradient(tx,ty,0,tx,ty,13),pu=.3+.2*Math.sin(now/110);   // แสงยาที่จุดฉีด
      g.addColorStop(0,'rgba(150,230,255,'+pu+')');g.addColorStop(1,'rgba(150,230,255,0)');ctx.fillStyle=g;ctx.fillRect(tx-14,ty-14,28,28);
      for(let k=0;k<3;k++){const r=(e*16+k*7)%21;ctx.strokeStyle='rgba(160,235,255,'+(1-r/21)*.8+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(tx,ty,r,0,7);ctx.stroke()}}   // วงคลื่นยากระจาย
    ctx.globalAlpha=al;ctx.translate(tx+dx*sd+sw,ty+dy*sd);ctx.rotate(ang);ctx.scale(.9,.9);drawSyringe(ctx,L);ctx.restore()}
  if(e>=T.jab){   // เครื่องหมายบวกสีเขียวลอยรอบตัว (ยาออกฤทธิ์)
    ctx.save();ctx.fillStyle='#6be28a';const n=e<T.inj?3:5;
    for(let i=0;i<n;i++){const ph=(e*.9+i*.37)%1,x=B.l+(B.r-B.l)*((i+.5)/n)+Math.sin(e*3+i)*3,y=B.b-(B.b-B.t)*ph*1.1;ctx.globalAlpha=Math.sin(ph*Math.PI)*.9;ctx.fillRect(x-1,y-3,2,6);ctx.fillRect(x-3,y-1,6,2)}
    ctx.restore()}
  if(e>=T.out){const u=q((e-T.out)/(HEAL_SEC-T.out));ctx.save();ctx.font='14px sans-serif';ctx.textAlign='center';ctx.globalAlpha=1-u*.4;ctx.fillText('💖',(B.l+B.r)/2,B.t-4-u*22);ctx.restore()}   // ใกล้หาย: หัวใจลอย
}

/* ===== ด่านย่อย: แต่ละด่านมี 5 ด่านย่อย (1-1 … 1-5) ไล่ความยากขึ้นเรื่อยๆ · 1-5 = บอส ===== */
const SUBN=5,SUB=[{lv:0,k:1},{lv:1,k:1.05},{lv:2,k:1.1},{lv:3,k:1.15},{lv:4,k:1.2}];   // ปรับความยาก: lv = เลเวลศัตรูที่บวกเพิ่ม · k = ตัวคูณสเตตัส ต่อด่านย่อย (บอสบวก Lv.+4 จากค่านี้อีกที)
const subKey=(a,j)=>j===SUBN?a.id+'_b':a.id+'_'+j;                 // 1-5 ใช้คีย์เดิม (_b) เพื่อให้เซฟเก่าและเงื่อนไขอื่นที่อ้างถึงยังใช้ได้

<script>

<script>
/* Fullscreen: ต้องเรียกจากการกดปุ่มโดยผู้เล่นตามข้อกำหนดของเบราว์เซอร์ */
(()=>{
  const btn=document.getElementById('fullscreenBtn');
  if(!btn)return;
  const isFullscreen=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement);
  const sync=()=>{
    const active=isFullscreen();
    btn.textContent=active?'⤢':'⛶';
    btn.title=active?'ออกจากเต็มหน้าจอ':'เต็มหน้าจอ';
    btn.setAttribute('aria-label',btn.title);
  };
  const notify=(message)=>{
    if(typeof window.toast==='function')window.toast(message);
    else {const el=document.getElementById('toast');if(el){el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600);}}
  };
  btn.addEventListener('click',async()=>{
    try{
      if(isFullscreen()){
        const exit=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
        if(exit)await exit.call(document);
        else notify('เบราว์เซอร์นี้ไม่รองรับการออกจากเต็มหน้าจอผ่านปุ่ม');
      }else{
        const target=document.documentElement;
        const request=target.requestFullscreen||target.webkitRequestFullscreen||target.msRequestFullscreen;
        if(request){
          const result=request.call(target);
          if(result&&typeof result.then==='function')await result;
          sync();
        }else{
          notify('เบราว์เซอร์นี้ไม่รองรับ Fullscreen API หากใช้ iPad ให้ลองเพิ่มเกมไปยังหน้าจอโฮมแล้วเปิดจากไอคอน');
        }
      }
    }catch(err){
      notify('ไม่สามารถเปิดเต็มหน้าจอได้ กรุณาลองกดอีกครั้ง หรือใช้เมนูเบราว์เซอร์');
    }
    sync();
  });
  document.addEventListener('fullscreenchange',sync);
  document.addEventListener('webkitfullscreenchange',sync);
  document.addEventListener('MSFullscreenChange',sync);
  sync();
})();
</script>

/* ---------- เริ่ม/รีเซ็ต ---------- */
function makeStars(){const a=[];for(let i=0;i<46;i++)a.push({x:Math.random()*W,y:Math.random()*H,v:14+Math.random()*60,z:Math.random()<.2?2:1,c:['#fff','#b78cff','#6ee7f9','#8b7a9e'][i%4]});return a}
function newGame(state){
  G={state,t:0,ship:{x:W/2,y:H-34,hp:3,inv:1.6,shield:0},wl:1,fire:0,score:0,kills:0,bul:[],eb:[],en:[],pu:[],pt:[],boss:null,bossDead:0,nextAdd:0,

  pu(x,k){G.pu.push({x,y:-8,k,t:0})},

function schedule(){const ev=[],add=(t,f)=>ev.push({t,f}),seq=(t0,n,dt,f)=>{for(let i=0;i<n;i++)add(t0+i*dt,()=>f(i))};

  seq(4,6,.3,i=>sp.grunt(i%2?120:40,'sin'));
  seq(6.5,2,1,i=>sp.shooter(45+i*70));
  add(8,()=>sp.pu(60,'P'));
  seq(9,2,.9,i=>sp.rock(40+i*80));

/* ---------- อนุภาค / กระสุน ---------- */
function boom(x,y,n,cols,sp0){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(sp0||40)*(.3+Math.random());G.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.35+Math.random()*.35,c:cols[i%cols.length]})}}
const EC=['#ffd166','#ff6b9a','#fff'];
function pb(x,y,vx){G.bul.push({x,y,vx,vy:-175})}
function shootAt(x,y,spd){au.eshoot();const s=G.ship,dx=s.x-x,dy=s.y-y,d=Math.hypot(dx,dy)||1;G.eb.push({x,y,vx:dx/d*spd,vy:dy/d*spd})}

function hurt(){const s=G.ship;if(s.inv>0||G.state!=='play')return;
  if(s.shield>0){au.shield();s.shield=0;s.inv=.9;boom(s.x,s.y,10,['#6ee7f9','#fff'],50);return}
  au.hurt();s.hp--;s.inv=1.7;G.shake=.28;boom(s.x,s.y,14,EC,60);
  if(s.hp<=0){boom(s.x,s.y,40,EC,90);finish(false,'dead')}}
function kill(e){au.boom(e.k==='r'?2:1);G.score+=e.sc;G.kills++;boom(e.x,e.y,e.k==='r'?14:9,e.k==='g'?['#7be08a','#fff','#ffd166']:EC,e.k==='r'?36:50);e.dead=1}

/* ---------- อัปเดตเกม ---------- */
function step(dt){
  for(const s of G.stars){s.y+=s.v*dt*(G.state==='play'?1:.5);if(s.y>H){s.y=-2;s.x=Math.random()*W}}
  for(const p of G.pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}G.pt=G.pt.filter(p=>p.l>0);
  G.shake=Math.max(0,G.shake-dt);
  if(G.state!=='play')return;
  const S=G.ship;G.t+=dt;G.warn=Math.max(0,G.warn-dt);S.inv=Math.max(0,S.inv-dt);
  while(G.evi<G.ev.length&&G.ev[G.evi].t<=G.t){G.ev[G.evi].f();G.evi++}
  /* ยานผู้เล่น */
  const kx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0),ky=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0);

  S.x=Math.max(7,Math.min(W-7,S.x));S.y=Math.max(70,Math.min(H-10,S.y));au.engine(S.x,S.y,dt);
  /* ยิงอัตโนมัติ (ยังยิงต่อระหว่างบอสระเบิด เพื่อความมัน) */
  if(!G.bossDead||G.bossDead<1){G.fire-=dt;if(G.fire<=0){G.fire=.15;au.shoot(G.wl);
    if(G.wl===1)pb(S.x,S.y-6,0);else if(G.wl===2){pb(S.x-3,S.y-6,0);pb(S.x+3,S.y-6,0)}else{pb(S.x,S.y-7,0);pb(S.x-4,S.y-5,-16);pb(S.x+4,S.y-5,16)}}}
  /* ศัตรู */
  for(const e of G.en){e.t+=dt;e.fl-=dt;
    if(e.k==='g'){if(e.p==='str')e.y+=34*dt;else if(e.p==='sin'){e.y+=30*dt;e.x=e.x0+Math.sin(e.t*3)*26}else{e.y+=30*dt;e.x+=(e.p==='dgR'?1:-1)*38*dt}}
    else if(e.k==='s'){e.y+=(e.y<40?30:12)*dt;e.x=Math.max(10,Math.min(W-10,e.x0+Math.sin(e.t*1.6)*18));e.cd-=dt;if(e.cd<=0&&e.y>6&&e.y<H-80){e.cd=1.9;shootAt(e.x,e.y+6,52)}}
    else{e.y+=26*dt;e.x+=e.vx*dt}

    if(!e.dead&&Math.abs(e.x-S.x)<e.w/2+3&&Math.abs(e.y-S.y)<e.h/2+3){if(S.inv<=0){hurt();kill(Object.assign(e,{sc:0}))}}}

    if(b.in){b.y+=22*dt;if(b.y>=34){b.y=34;b.in=false}}
    else{b.x=W/2+Math.sin(b.t*.8)*42;b.cd-=dt;b.cd2-=dt;const rage=b.hp<b.max*.5;
      if(b.cd<=0){b.cd=rage?1.05:1.5;fan(b,rage?7:5)}
      if(b.cd2<=0){b.cd2=rage?1.4:2.2;shootAt(b.x,b.y+9,62)}
      if(G.t>=G.nextAdd){G.nextAdd=G.t+2.6;sp.grunt(20+Math.random()*120,'sin')}}
    if(Math.abs(b.x-S.x)<b.w/2+2&&Math.abs(b.y-S.y)<b.h/2+3)hurt()}

  for(const u of G.bul){u.x+=u.vx*dt;u.y+=u.vy*dt;if(u.y<-8)u.dead=1;if(u.dead)continue;
    for(const e of G.en){if(e.dead||e.y<-4)continue;if(Math.abs(u.x-e.x)<e.w/2+1.5&&Math.abs(u.y-e.y)<e.h/2+3){u.dead=1;e.hp--;e.fl=.07;au.hit();boom(u.x,u.y,2,['#fff','#6ee7f9'],30);if(e.hp<=0)kill(e);break}}
    if(!u.dead&&b&&!G.bossDead&&Math.abs(u.x-b.x)<b.w/2+1&&Math.abs(u.y-b.y)<b.h/2+3&&!b.in){u.dead=1;b.hp--;b.fl=.06;au.bhit();boom(u.x,u.y,2,['#fff','#ffd166'],30);
      if(b.hp<=0){au.bossBoom();G.bossDead=.0001;G.score+=200;G.eb=[];boom(b.x,b.y,60,EC,110)}}}
  /* กระสุนศัตรู */
  for(const u of G.eb){u.x+=u.vx*dt;u.y+=u.vy*dt;if(u.y>H+6||u.y<-8||u.x<-8||u.x>W+8)u.dead=1;
    if(!u.dead&&Math.hypot(u.x-S.x,u.y-S.y)<4.5){u.dead=1;hurt()}}
  /* ไอเทม */
  for(const p of G.pu){p.t+=dt;p.y+=28*dt;p.x+=Math.sin(p.t*3)*.3;if(p.y>H+8)p.dead=1;
    if(!p.dead&&Math.hypot(p.x-S.x,p.y-S.y)<10){p.dead=1;au.pick(p.k);boom(p.x,p.y,8,[PU[p.k].c,'#fff'],40);

  G.bul=G.bul.filter(x=>!x.dead);G.eb=G.eb.filter(x=>!x.dead);G.en=G.en.filter(x=>!x.dead);G.pu=G.pu.filter(x=>!x.dead);
  /* บอสแตก → ชนะ · หมดเวลา → แพ้ */
  if(G.bossDead){G.bossDead+=dt;if(G.state==='play'&&G.bossDead>1.4){G.ship.inv=9;finish(true)}}
  else if(G.t>=DUR)finish(false,'time')
}

(function(){

function send(d,mode){const neg={},pos={};for(const k in d.i)(d.i[k]<0?neg:pos)[k]=Math.abs(d.i[k]);
  if(mode==='buy'){const ks=Object.keys(pos);if(ks.length===1)call('econ_buy',{p_item:ks[0],p_qty:pos[ks[0]]}).then(done);return}
  if(d.c<0||Object.keys(neg).length)call('econ_spend',{p_coins:Math.max(0,-d.c),p_items:neg}).then(done);
  if(mode&&mode!=='spend'){const st=pos.skstone||0,fo={};for(const k in pos)if(k!=='skstone')fo[k]=pos[k];
    if(d.c>0||st||Object.keys(fo).length)call('econ_claim',{p_src:mode,p_coins:Math.max(0,d.c),p_stones:st,p_items:fo}).then(done)}}

['buyPartner','buyTok','buyCrystalCoin','cloudPull'].forEach(wrapSync);
setInterval(()=>{try{if(!ON()){synced=null;return}const id=user&&user.id;if(synced!==id){synced=id;fix()}}catch(e){}},1500);
/* --- เวลาผู้ช่วยดูแลอยู่ที่ server: care_settle / care_start / care_stop / care_set_needs / care_heartbeat --- */

  if(r&&r.ok!==false&&r.care){care(r);const from=Date.now()-(r.elapsed_ms||0),cov=r.covered_ms||0;a.coveredFrom=cov>0?from:0;a.coveredUntil=cov>0?from+cov:1;a.lastSettledAt=Date.now()}
  else{a.enabled=false;a.coveredUntil=1;a.coveredFrom=0}}   // ติดต่อ server ไม่ได้ → ไม่ดูแลรอบนี้ (เวลาไม่ถูกตัด)
{const o=window.autoCareSettleLocal;window.autoCareSettleLocal=function(){if(ON())return;return o.apply(this,arguments)}}
{const o=window.autoCareTick;window.autoCareTick=function(p,at){const a=p&&p.autoCare;if(ON()&&a&&a.coveredFrom&&at<a.coveredFrom)return;return o.apply(this,arguments)}}
{const o=window.startGame;window.startGame=function(){careReady=true;return o.apply(this,arguments)}}
{const o=window.acStart;window.acStart=async function(useCards){if(!ON())return o.apply(this,arguments);

    else{if(!apply(r)){care(r)}toast('🧑🏻‍🍼 เปิดผู้ช่วยดูแล'+(n?' · ใช้บัตร '+n+' ใบ (+'+(n*2)+' ชม.)':'')+' · เวลาคงเหลือ '+autoHrTxt(P.autoCare.remainMs)+' (นับเฉพาะตอนออฟไลน์)');save(true);renderPanel();update()}}

{const o=window.autoCareToggle;window.autoCareToggle=function(){const was=!!(P&&P.autoCare&&P.autoCare.enabled),res=o.apply(this,arguments);if(ON()&&was)call('care_stop').then(done);return res}}
{const o=window.autoCareToggleNeed;window.autoCareToggleNeed=function(){const res=o.apply(this,arguments);if(ON())call('care_set_needs',{p_needs:P.autoCare.selectedNeeds}).then(done);return res}}
setInterval(()=>{if(careReady&&ON())call('care_heartbeat')},30000);

{const o=window.qAdd;window.qAdd=function(k){const res=o.apply(this,arguments);

/* ---------- 2) เหตุการณ์สุ่ม: เจอของที่หายไปตอนเดินเล่น (ต้องอารมณ์ดี hap ≥ 70) ---------- */
let evStop='';   // วันที่ server บอกว่าเพดานรายวันเต็มแล้ว → ไม่ลองอีกจนกว่าจะข้ามวัน
async function tryEvent(){
  const d=dayKey();if(evStop===d)return;
  let xp=FALLBACK.event;
  if(ON()){const r=await socCall('xp_bonus',{p_k:'event'});if(!r||r.ok===false){if(r&&r.done)evStop=d;return}xp=r.xp}
  else{if(!P.evDay||P.evDay.d!==d)P.evDay={d,n:0};if(P.evDay.n>=3){evStop=d;return}P.evDay.n++}
  if(!alive())return;rt.walkUntil=Date.now()+2500;rt.dir=Math.random()<.5?-1:1;
  gainBonus('🔍','ดูนั้นสิของที่หายไป','สัตว์เลี้ยงของคุณดีใจที่ได้พบเจอสิ่งของที่หายไป',xp)}
setInterval(()=>{
  if(document.hidden||!alive()||$('#game').classList.contains('hide'))return;
  if(P.sleeping||P.sick||P.bathing||P.healLeft>0||rt.panel||showing)return;
  if(P.hap<70)return;
  if(Math.random()<.06)tryEvent()},25000);   // เฉลี่ยประมาณทุก ~7 นาทีที่อารมณ์ดี · ปรับ .06 ได้
})();
</script>

<!-- ===== v20: จุติ + Soul Power · รัน supabase_v20_rebirth.sql ก่อน ===== -->
<script>
(function(){
const ON=()=>!!(sb&&user),sleep=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAXG=6,SN={gene:['🧬','ยีน','ยีนเริ่มต้นของไข่ +1 ต่อระดับ'],growth:['📈','การเติบโต','EXP ที่ได้ +3% ต่อระดับ'],luck:['🍀','โชค','เหรียญจากด่าน +3% · คริสตัลดรอป +1% ต่อระดับ']};
window.SOULM={xp:1,coin:1,cry:0,gene:0};let S=null,busy=false,gd='M';
const ok=p=>!!p&&p.dead&&p.stage===3&&p.cause==='ชราภาพ'&&(p.gen||1)<MAXG;
const run=async fn=>{if(busy)return;busy=true;try{return await fn()}finally{busy=false}};
async function flush(){save(true);await sleep(40);while(cloudBusy)await sleep(80)}
async function pull(){if(!ON())return;const r=await socCall('soul_get');if(r&&r.ok!==false&&r.mult){S=r;Object.assign(SOULM,r.mult)}}
const _sg=startGame;startGame=function(){_sg.apply(this,arguments);pull()};
const _ag=again;again=function(){if(ok(P)&&!confirm('สัตว์ตัวนี้จุติได้! ถ้าเริ่มใหม่ จะเสียสายเลือดและ Soul Point รุ่นนี้ ต้องการเริ่มใหม่จริงหรือ?'))return;_ag()};
window.rbBtn=()=>ok(P)?'<button onclick="rbOpen()">🔄 จุติ (รุ่นที่ '+((P.gen||1)+1)+'/'+MAXG+')</button>':(P&&P.dead&&P.stage===3&&P.cause==='ชราภาพ'?'<div class="mut" style="margin-top:6px">สายเลือดนี้จุติครบแล้ว</div>':'');
const ov=document.createElement('div');ov.className='modal hide';ov.innerHTML='<div class="mbox" style="max-width:460px"><div id="v20Body"></div><div class="row" style="margin-top:8px"><button id="v20Close" class="mut">ปิด</button></div></div>';document.body.appendChild(ov);
const B=ov.querySelector('#v20Body');ov.querySelector('#v20Close').onclick=()=>ov.classList.add('hide');

window.rbOpen=()=>run(async()=>{

  const sync=()=>B.querySelectorAll('[data-rg]').forEach(b=>b.classList.toggle('on',b.dataset.rg===gd));sync();
  B.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{gd=b.dataset.rg;sync()});

const go=()=>run(async()=>{

  P=migrate(d);P.last=Date.now();P.coins=r.coins;P.inv=Object.assign({},r.items||{});rt.panel=null;ov.classList.add('hide');
  startGame();save(true);toast('🔄 จุติสำเร็จ! รุ่นที่ '+r.gen+' · 🔮 +'+r.gain)});

function soulRender(){

  Object.keys(SN).forEach(k=>{const lv=+(S.soul_up[k]||0),c=lv>=5?null:S.costs[lv];

    S=r;Object.assign(SOULM,r.mult);soulRender()}))}
async function soulOpen(){if(!ON())return toast('ต้องเข้าสู่ระบบก่อน');await pull();if(!S)return toast('เปิดไม่ได้ (ต้องรัน supabase_v20_rebirth.sql)');soulRender();ov.classList.remove('hide')}
/* 🛠️ DEV: เลือกสาเหตุการตายแล้วกดตาย เพื่อทดสอบจุติ (แถบ DEV: ?dev=1 หรือ Ctrl+Shift+D) */
